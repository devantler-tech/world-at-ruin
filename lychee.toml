# MegaLinter passes this file to lychee with --config when it exists at the repository root
# (verified: an invalid value here fails the lint job). The timeout in .mega-linter.yml is
# passed on the command line alongside it and still applies.

# Brief rate limits can outlast the default three retries even with host pacing.
# Allow five retries (six attempts total), retaining lychee's exponential backoff.
# The MegaLinter adapter owns this budget for 429, 503 and 504. Native 0.24.2
# rejects 503/504 without retrying; nested native retries are disabled so mixed
# statuses share six attempts. Persistent errors and dead links still fail.
# tools/lychee-retry/lychee_test.go exercises this policy with the CI binary.
max_retries = 5

# docs.godotengine.org rate-limits bursts. Several Godot class pages are cited from the same
# documents, and lychee fetches URLs concurrently, so the host answers the first request and
# returns 429 Too Many Requests for the next. A 429 describes our request rate, not the link,
# so the answer is to pace requests to that host, not a .lycheeignore entry that would stop
# checking valid links for good. Both links are still checked on every run; the pacing
# below applies only to this host, while the bounded retry budget above is global.
[hosts."docs.godotengine.org"]
concurrency = 1
request_interval = "1s"
