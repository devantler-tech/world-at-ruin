version: "2"
run:
  allow-parallel-runners: true
  modules-download-mode: readonly
linters:
  # Named explicitly rather than inherited from a default set: this is the
  # server that has to stay up for everyone connected to it, so the set is the
  # classes that take a process down or corrupt what it sends — not style.
  default: none
  enable:
    - asasalint
    - bodyclose
    - contextcheck
    - copyloopvar
    - durationcheck
    - errcheck
    - errorlint
    - exhaustive
    - fatcontext
    - forcetypeassert
    - gocritic
    - gosec
    - govet
    - ineffassign
    - makezero
    - nilerr
    - noctx
    - protogetter
    - reassign
    - recvcheck
    - staticcheck
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - wastedassign
  exclusions:
    warn-unused: true
    rules:
      # The separate issuer experiment needs a traversable public ancestor;
      # its issuer/admin state stays 0700 and logs/token files stay 0600.
      - path: ^(\.\./tools/spire-trial/)?native_fixture_test\.go$
        linters: [gosec]
        text: "G302: Expect file permissions to be 0600 or less"
        source: 'if err = os\.Chmod\(dir, 0755\); err != nil'
      # Fixed pinned issuer binaries and this test's own executable receive
      # only fixture-owned paths/role options. No player input chooses a command.
      - path: ^(\.\./tools/spire-trial/)?native_fixture_test\.go$
        linters: [gosec]
        text: "G204: Subprocess launched with variable"
        source: 'exec\.CommandContext\(f\.ctx, ("/opt/spire/bin/spire-(server|agent)"|binary),'
      # This helper's executable is immutable; callers are test-controller
      # administrative operations, and their output is never printed publicly.
      - path: ^(\.\./tools/spire-trial/)?native_test\.go$
        linters: [gosec]
        text: "G204: Subprocess launched with variable"
        source: 'c := exec\.CommandContext\(ctx, "/opt/spire/bin/spire-server", args\.\.\.\)'
      # Permission-refusal probe opens the controller's known-existing private
      # directory without reading or exporting any content.
      - path: ^(\.\./tools/spire-trial/)?native_worker_test\.go$
        linters: [gosec]
        text: "G304: Potential file inclusion via variable"
        source: 'd, err := os\.Open\(private\)'
      # The diagnostic socket ancestor contains no issuer or secret material;
      # packet credentials, not a filesystem path, bind the launched sender.
      - path: ^(\.\./tools/owned-child-trial/)?native_acceptance_test\.go$
        linters: [gosec]
        text: "G302: Expect file permissions to be 0600 or less"
        source: 'if err := os\.Chmod\((directory, 0755|address, 0666)\); err != nil'
      # The private claim endpoint is immutable constructor configuration,
      # The helper executable is a fixed immutable image path. Only trusted
      # fixture modes and its own disposable socket path choose arguments.
      - path: ^(\.\./tools/owned-child-trial/)?native_process_test\.go$
        linters: [gosec]
        text: "G204: Subprocess launched with a potential tainted input or cmd arguments"
        source: 'cmd := exec\.Command\("/out/owned-child\.test", "-war-experimental", "-war-worker="\+mode, "-war-address="\+address\)'
      # The private claim endpoint is immutable constructor configuration,
      # validated as HTTPS with a fixed path and no redirects. Player payloads
      # cannot influence its destination; private service addresses are intended.
      - path: ^claimrpc/client\.go$
        linters:
          - gosec
        text: "G704: SSRF via taint analysis"
        source: 'response, err := c\.http\.Do\(req\)'
      # This request targets only the loopback httptest server created by the
      # test. Fuzzed JSON is the body, never a destination or redirect source.
      - path: ^claimrpc/boundary_test\.go$
        linters:
          - gosec
        text: "G704: SSRF via taint analysis"
        source: 'response, err := client\.Do\(request\)'
      # These requests target only the loopback private listener the test
      # started, with a fixed empty body; nothing untrusted chooses the address.
      - path: ^nakamaruntime/private_listener_test\.go$
        linters:
          - gosec
        text: "G704: SSRF via taint analysis"
        source: 'response, err := client\.Do\(request\)'
      # Nakama's public context API uses these exact string constants. RPC
      # fixtures must reproduce it, not use private keys the server never sets.
      - path: ^(nakamaauth|nakamaruntime|internal/nakamajournalprobe)/.*_test\.go$
        linters:
          - staticcheck
        text: "SA1029: should not use built-in type string as key"
        source: 'context\.WithValue\(.*runtime\.RUNTIME_CTX_'
      # Counts are validated against MaxEntities before this private encoder
      # helper runs, so the value is strictly inside the uint32 wire field.
      - path: ^wire/wire\.go$
        linters:
          - gosec
        text: "G115: integer overflow conversion int -> uint32"
        source: 'return binary\.LittleEndian\.AppendUint32\(b, uint32\(n\)\)'
      # Signed coordinates use the protocol word as an equal-width
      # two's-complement representation; these two helpers are exact inverses.
      - path: ^wire/wire\.go$
        linters:
          - gosec
        text: "G115: integer overflow conversion int64 -> uint64"
        source: 'return binary\.LittleEndian\.AppendUint64\(b, uint64\(v\)\)'
      - path: ^wire/wire\.go$
        linters:
          - gosec
        text: "G115: integer overflow conversion uint64 -> int64"
        source: 'return int64\(v\)'
      # The simulation's determinism digests fold signed coordinates and health
      # by their two's-complement bits. This one helper is an equal-width
      # reinterpretation, not a narrowing, so nothing can be lost; every other
      # signed-to-unsigned conversion in the package stays checked.
      - path: ^sim/world\.go$
        linters:
          - gosec
        text: "G115: integer overflow conversion int64 -> uint64"
        source: 'func twosComplementBits\(v int64\) uint64 \{ return uint64\(v\) \}'
issues:
  # Every finding is reported, across the whole module: the gate is not scoped
  # to what a change touches, so an untouched file cannot hide a regression.
  max-issues-per-linter: 0
  max-same-issues: 0
