version: "2"
run:
  allow-parallel-runners: true
  modules-download-mode: readonly
linters:
  # Named explicitly rather than inherited from a default set: this is the
  # server that has to stay up for everyone connected to it, so the set is the
  # classes that take a process down or corrupt what it sends — not style.
  default: none
  enable:
    - asasalint
    - bodyclose
    - contextcheck
    - copyloopvar
    - durationcheck
    - errcheck
    - errorlint
    - exhaustive
    - fatcontext
    - forcetypeassert
    - gocritic
    - gosec
    - govet
    - ineffassign
    - makezero
    - nilerr
    - noctx
    - protogetter
    - reassign
    - recvcheck
    - staticcheck
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - wastedassign
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  # Blocking for the lines a change touches, so the findings that predate the
  # gate (inventoried in #436) do not wall off unrelated work. This fails
  # CLOSED: when the base ref cannot be resolved the whole backlog is reported
  # and the job goes red, so a broken diff base can never pass vacuously.
  # Remove this line once #436 reaches zero and the gate covers the module.
  new-from-merge-base: origin/main
