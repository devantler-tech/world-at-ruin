version: "2"
run:
  allow-parallel-runners: true
  modules-download-mode: readonly
linters:
  # Named explicitly rather than inherited from a default set: this is the
  # server that has to stay up for everyone connected to it, so the set is the
  # classes that take a process down or corrupt what it sends — not style.
  default: none
  enable:
    - asasalint
    - bodyclose
    - contextcheck
    - copyloopvar
    - durationcheck
    - errcheck
    - errorlint
    - exhaustive
    - fatcontext
    - forcetypeassert
    - gocritic
    - gosec
    - govet
    - ineffassign
    - makezero
    - nilerr
    - noctx
    - protogetter
    - reassign
    - recvcheck
    - staticcheck
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - wastedassign
  exclusions:
    warn-unused: true
    rules:
      # Nakama's public context API uses these exact string constants. RPC
      # fixtures must reproduce it, not use private keys the server never sets.
      - path: ^(nakamaauth|nakamaruntime)/.*_test\.go$
        linters:
          - staticcheck
        text: "SA1029: should not use built-in type string as key"
        source: 'context\.WithValue\(.*runtime\.RUNTIME_CTX_'
      # Counts are validated against MaxEntities before this private encoder
      # helper runs, so the value is strictly inside the uint32 wire field.
      - path: ^wire/wire\.go$
        linters:
          - gosec
        text: "G115: integer overflow conversion int -> uint32"
        source: 'return binary\.LittleEndian\.AppendUint32\(b, uint32\(n\)\)'
      # Signed coordinates use the protocol word as an equal-width
      # two's-complement representation; these two helpers are exact inverses.
      - path: ^wire/wire\.go$
        linters:
          - gosec
        text: "G115: integer overflow conversion int64 -> uint64"
        source: 'return binary\.LittleEndian\.AppendUint64\(b, uint64\(v\)\)'
      - path: ^wire/wire\.go$
        linters:
          - gosec
        text: "G115: integer overflow conversion uint64 -> int64"
        source: 'return int64\(v\)'
      # The simulation's determinism digests fold signed coordinates and health
      # by their two's-complement bits. This one helper is an equal-width
      # reinterpretation, not a narrowing, so nothing can be lost; every other
      # signed-to-unsigned conversion in the package stays checked.
      - path: ^sim/world\.go$
        linters:
          - gosec
        text: "G115: integer overflow conversion int64 -> uint64"
        source: 'func twosComplementBits\(v int64\) uint64 \{ return uint64\(v\) \}'
issues:
  # Every finding is reported, across the whole module: the gate is not scoped
  # to what a change touches, so an untouched file cannot hide a regression.
  max-issues-per-linter: 0
  max-same-issues: 0
