version: 2

updates:
  # The Go module lives in server/, not the repo root.
  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      semver-major-days: 14
      # devantler-tech Go modules are our own code — bump now, no cooldown.
      exclude:
        - "github.com/devantler-tech/*"

  # Workflow validation is an independent Go tool, not part of the game server.
  - package-ecosystem: gomod
    directory: /.github/scripts/release-credential-boundary
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      semver-major-days: 14

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      # devantler-tech actions/workflows are our own code — bump now, no cooldown.
      exclude:
        - "devantler-tech/*"
