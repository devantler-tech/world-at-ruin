---
# Repository trust policy for .github/workflows/dependabot-server-tidy.yaml, served by the GitHub token broker
# (devantler-tech/monorepo ADR 0020). Only that workflow, on this repository's main branch,
# may exchange its Actions OIDC token. It grants contents write, to push the tidy commit onto Dependabot's branch on this repository alone.
issuer: https://token.actions.githubusercontent.com
subject: repo:devantler-tech/world-at-ruin:ref:refs/heads/main
claim_pattern:
  repository_owner_id: "178524219"
  job_workflow_ref: devantler-tech/world-at-ruin/\.github/workflows/dependabot-server-tidy\.yaml@refs/heads/main
permissions:
  contents: write
app: botantler-2
