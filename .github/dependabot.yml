version: 2

updates:
  # The Go module lives in server/, not the repo root.
  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      semver-major-days: 14
      # devantler-tech Go modules are our own code — bump now, no cooldown.
      exclude:
        - "github.com/devantler-tech/*"
    ignore:
      # This is a nested module in this repository, required by a pseudo-version.
      # Its versions are this repository's tags (vX.Y.Z), which Go cannot resolve
      # for a nested module path, so Dependabot can never update it. It is moved
      # on purpose, together with the change to server/nakama-issued-runtime.
      - dependency-name: "github.com/devantler-tech/world-at-ruin/server/nakama-issued-runtime"

  # The explicitly experimental issued runtime has independent module locks.
  - package-ecosystem: gomod
    directory: /server/nakama-issued-runtime
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      semver-major-days: 14

  # Workflow validation is an independent Go tool, not part of the game server.
  - package-ecosystem: gomod
    directory: /.github/scripts/release-credential-boundary
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      semver-major-days: 14

  # Disposable workload issuer proof has its own dependency graph.
  - package-ecosystem: gomod
    directory: /tools/spire-trial
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      semver-major-days: 14

  # Disposable process ownership proof has its own syscall dependency graph.
  - package-ecosystem: gomod
    directory: /tools/owned-child-trial
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      semver-major-days: 14

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      # devantler-tech actions/workflows are our own code — bump now, no cooldown.
      exclude:
        - "devantler-tech/*"
