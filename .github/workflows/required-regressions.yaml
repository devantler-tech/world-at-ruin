name: Required regression control

# This workflow is not trusted because it lives on main; it is trusted because
# the repository ruleset pins the exact reviewed commit that contains it. A
# candidate therefore cannot edit the selector, harness, runner, or aggregate
# gate that evaluates its product code.
on:
  pull_request:
  merge_group:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.1
  GODOT_SHA512: 4ccdab7a48eeccbe8819a2fc1f6262f8d72065d98601bcb3743fcbd7ebd39f373758a788ee3293a05ec5b2c48538266c437404312e372225cd2df273945a2de9

jobs:
  trusted-client-regressions:
    name: Trusted client regressions
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out candidate product code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          persist-credentials: false

      - name: Check out the exact ruleset-pinned workflow snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: devantler-tech/world-at-ruin
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false

      - name: Install Godot (pinned, checksum-verified)
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          echo "${GODOT_SHA512}  godot.zip" | sha512sum -c -
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot

      - name: Run the trusted regression aggregate against the candidate
        run: trusted/tools/required-regression-control.sh trusted candidate
