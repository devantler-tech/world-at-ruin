name: Nakama native acceptance

on:
  workflow_call:
  push:
    branches: ['codex/nakama-native-runtime-*']

permissions:
  contents: read

jobs:
  native:
    name: Nakama native (${{ matrix.arch }})
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the explicitly experimental native bundle and acceptance image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: server/Dockerfile.nakama-native
          build-args: EXPERIMENTAL=true
          load: true
          tags: world-at-ruin-nakama-native:ci
      - name: Exercise the actual packaged runtime against disposable PostgreSQL
        run: bash tools/smoke-nakama-native.sh world-at-ruin-nakama-native:ci --experimental
