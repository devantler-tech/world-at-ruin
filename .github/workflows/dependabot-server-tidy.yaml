name: Dependabot server tidy

# A Dependabot update to server/go.mod changes only the server's own locks. The modules that
# replace the server module with the local tree (the issued runtime and the native trials)
# keep their own go.mod/go.sum, so their -mod=readonly builds and tests fail until
# `go mod tidy` runs in them (#1654). This workflow runs that tidy on the Dependabot branch and
# commits the result, so a server update passes CI without hand edits.
#
# Trust boundary:
# - pull_request_target runs this file from main with the repository's secrets. GitHub keeps
#   them for Dependabot here because the base ref (main) is not a Dependabot branch.
# - The job runs only for a same-repository Dependabot server branch triggered by Dependabot
#   itself. Its own commit arrives as the App, so it never re-triggers this job.
# - The tidy script is checked out from the base commit; the PR head supplies only the module
#   files it tidies. `go mod tidy` downloads and checks modules but runs no module code.
# - Neither checkout persists a credential. The App token is minted after go has finished and is
#   visible only to the commit step, which commits through createCommitOnBranch (signed by
#   GitHub) pinned to the head that was tidied.
# - The App commit starts the normal CI on the new head; nothing here skips or relaxes a check.
# tools/server-dependents-tidy.test.sh pins these properties.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - server/go.mod

permissions: {}

jobs:
  tidy:
    name: Tidy the modules that replace the server module
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/go_modules/server/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: dependabot-server-tidy-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Check out the trusted tidy script from the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          persist-credentials: false
          sparse-checkout: tools/server-dependents-tidy.sh
          sparse-checkout-cone-mode: false
      - name: Check out the Dependabot head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: pr/server/go.mod
          # No shared cache from a pull_request_target job.
          cache: false
      - name: Tidy the dependent modules
        working-directory: pr
        run: bash ../base/tools/server-dependents-tidy.sh tidy
      - name: Get GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Commit the tidied locks
        working-directory: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash ../base/tools/server-dependents-tidy.sh commit "$REPOSITORY" "$BRANCH" "$HEAD_SHA"
