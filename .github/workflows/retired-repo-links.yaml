name: Retired repository links

# Share the same guard with proposed-change CI and independently verify every
# main push without running the application build or changing publication.
on:
  workflow_call:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  retired-repo-links:
    name: Retired repository links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check active documentation
        id: links
        uses: devantler-tech/.github/actions/validate-retired-repo-links@6195e2493aa94246954d70a4e15bcd8165c4ea64 # v10.0.0
        with:
          enabled: "true"
      - name: Require a completed scan
        env:
          VALIDATED: ${{ steps.links.outputs.validated }}
        run: test "$VALIDATED" = true
      - name: Prove retired links and incomplete scans fail
        env:
          GOWORK: "off"
          GOFLAGS: ""
          GOTOOLCHAIN: local
          VALIDATOR_SOURCE: ${{ steps.links.outputs.source-directory }}
        run: bash tools/retired-repo-links-controls.sh
      - name: Guard routing and credential boundary cannot be bypassed
        run: bash tools/retired-repo-links-workflow.test.sh
