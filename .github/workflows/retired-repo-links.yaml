name: Retired repository links

# Independently verify every
# main push without running the application build or changing publication.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  retired-repo-links:
    name: Retired repository links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate retired repository links
        # Keep the same exact-SHA, no-intervening-step boundary as PR CI while
        # MegaLinter's released actionlint lacks support for $/ references.
        uses: ./.github/actions/retired-repo-links
