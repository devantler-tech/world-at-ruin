name: Retired repository links

# Share the same guard with proposed-change CI and independently verify every
# main push without running the application build or changing publication.
on:
  workflow_call:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  retired-repo-links:
    name: Retired repository links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check active documentation
        id: links
        uses: devantler-tech/.github/actions/validate-retired-repo-links@8c0214ff944f615c35b122c4c8776151dfb561ce # v7.2.6
        with:
          enabled: "true"
      - name: Require a completed scan
        env:
          VALIDATED: ${{ steps.links.outputs.validated }}
        run: test "$VALIDATED" = true
      - name: Check out the exact validator for refusal controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: devantler-tech/.github
          ref: 8c0214ff944f615c35b122c4c8776151dfb561ce # v7.2.6
          path: .retired-link-validator-source
          persist-credentials: false
      - name: Prove retired links and incomplete scans fail
        env:
          GOWORK: "off"
          GOFLAGS: ""
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          control=$(mktemp -d "$RUNNER_TEMP/retired-links.XXXXXX")
          trap 'rm -rf "$control"' EXIT
          mkdir "$control/.github"
          cp .github/retired-repo-links.json "$control/.github/"
          cp README.md AGENTS.md "$control/"
          go -C .retired-link-validator-source/actions/validate-retired-repo-links build -mod=readonly -trimpath -o "$control/validator" .
          printf '\nhttps://github.com/devantler-tech/reusable-workflows\n' >>"$control/README.md"
          status=0
          "$control/validator" --root "$control" >"$control/negative.log" 2>&1 || status=$?
          test "$status" = 1 || { cat "$control/negative.log"; exit 1; }
          grep -Eq '^README.md:[0-9]+: link targets retired repository devantler-tech/reusable-workflows$' "$control/negative.log"
          rm "$control/.github/retired-repo-links.json"
          status=0
          "$control/validator" --root "$control" >"$control/missing.log" 2>&1 || status=$?
          test "$status" = 2 || { cat "$control/missing.log"; exit 1; }
          grep -q '^Invalid configuration:' "$control/missing.log"
          echo 'PASS: clean scan, seeded retired link rejection, and missing configuration refusal'
      - name: Guard routing and credential boundary cannot be bypassed
        run: bash tools/retired-repo-links-workflow.test.sh
