---
name: CD

# Production build + publish, triggered by the tag that release.yaml's
# semantic-release run pushes.
#
# TWO CONSTRAINTS FORCE THIS SHAPE — both learned the hard way, so do not
# "simplify" the trigger back to a release event:
#
# 1. IMMUTABLE RELEASES. Once a release is published its assets are frozen and
#    `gh release upload` fails with `HTTP 422: Cannot upload assets to an
#    immutable release`. The order must be build -> attach -> publish, so the
#    release has to still be a DRAFT while this workflow runs. That is why
#    `.releaserc` sets `draftRelease: true`.
#
# 2. ACTIONS IGNORES DRAFT RELEASE EVENTS. `on: release: types: [created]`
#    looks like the natural pairing for (1), but the GitHub Actions docs state:
#    "Workflows are not triggered for the `created`, `edited`, or `deleted`
#    activity types for draft releases." A draft would therefore sit
#    unpublished forever. (This is an Actions-specific restriction — the
#    underlying *webhook* does fire for drafts, which makes it an easy thing to
#    get wrong from the webhook docs alone.)
#
# `push: tags` is the only trigger that both fires and leaves the release a
# draft — which is exactly why every other repo in the org uses it. The tag
# push triggers workflows because semantic-release runs under a GitHub App
# token, not GITHUB_TOKEN.
#
# Ordering note: semantic-release pushes the tag BEFORE its github plugin
# creates the draft release, so this workflow can start before the draft
# exists. The "wait for the draft" step below closes that race.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build and attach assets to, e.g. v0.2.0"
        required: true
        type: string

concurrency:
  group: "CD-${{ github.ref_name || inputs.tag }}"
  cancel-in-progress: false
  queue: max # pending runs wait FIFO; the default replaces them

permissions:
  contents: read

jobs:
  publish-macos:
    name: 🍎 Publish macOS build
    # macOS runner on purpose: Godot's built-in AD-HOC codesign only works on a
    # macOS host, and an unsigned arm64 .app is killed by macOS before it can
    # launch — a Linux-exported unsigned zip would be dead on arrival on an
    # Apple-Silicon machine.
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read # build and exercise repo-controlled code without a release-write token
    env:
      GODOT_VERSION: 4.7.1
      # macOS universal editor + export templates, same SHA512-SUMS.txt
      # provenance as ci.yaml's pins. Keep these scoped to the unprivileged
      # build job: workflow-level env also reaches the release-write jobs.
      GODOT_MACOS_SHA512: a5c6443e193829de9a3237b57ef5e01c23839888900e241543da0dd4bac1050125e19469f0cca9a9958ac346070d98cab8e5d6aee16b181c6d06cda86bd07224
      GODOT_TEMPLATES_SHA512: afcc83d8d3d298038f19c58744a0d660fa75dd4baa33cb55d1011bb2565a2a8c2381728924564cb909e37c205a23f21b521b23bd057993afd43ae4da0b2f9d47
    outputs:
      sha256: ${{ steps.sha.outputs.sha256 }}
      manifest_sha256: ${{ steps.manifest.outputs.sha256 }}
    steps:
      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: 📑 Checkout the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Check out the TAG explicitly, and FULLY QUALIFIED as refs/tags/*.
          # On a release event github.sha is not guaranteed to be the tagged
          # commit, and shipping a build from any other commit would silently
          # mislabel the release. The refs/tags/ prefix is load-bearing: for an
          # unqualified ref actions/checkout resolves origin/<ref> BEFORE
          # refs/tags/<ref>, so if a branch ever shared the tag's name (the
          # repo's branch-name rule permits e.g. a literal `v0.2.0` branch)
          # CD would build the BRANCH while attaching the asset to the tag's
          # release.
          ref: refs/tags/${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          # This job publishes an artifact — never let the checkout token ride
          # along in it (zizmor artipacked).
          persist-credentials: false

      - name: 🏷️ Resolve the release version
        id: version
        env:
          RAW_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          # The repo's "Protect release tags" ruleset pins tags to
          # ^v\d+\.\d+\.\d+(-.+)?$ — re-assert it here so a hand-typed
          # workflow_dispatch value cannot produce a mislabelled build.
          if ! printf '%s' "${RAW_TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-.+)?$'; then
            echo "::error::'${RAW_TAG}' is not a vX.Y.Z release tag"
            exit 1
          fi
          echo "tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${RAW_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: ✍️ Stamp the release version into the build
        # The version is derived from the release tag, never hand-maintained.
        # Stamping happens HERE rather than as a commit back to main: a
        # commit-back would need write access to a protected branch and would
        # re-trigger release.yaml in a loop. The in-tree values stay the dev
        # values; only the shipped build carries the release version.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          perl -pi -e 's{^config/version=".*"$}{config/version="$ENV{VERSION}"}' client/project.godot
          perl -pi -e 's{^const VERSION := ".*"$}{const VERSION := "$ENV{VERSION}"}' client/scripts/devlog.gd
          # Fail loudly if either substitution missed — a silently unstamped
          # build would ship claiming the wrong version.
          grep -qxF "config/version=\"${VERSION}\"" client/project.godot \
            || { echo "::error::failed to stamp config/version in client/project.godot"; exit 1; }
          grep -qxF "const VERSION := \"${VERSION}\"" client/scripts/devlog.gd \
            || { echo "::error::failed to stamp VERSION in client/scripts/devlog.gd"; exit 1; }

      - name: ⬇️ Install Godot (pinned, checksum-verified)
        run: |
          set -euo pipefail
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          echo "${GODOT_MACOS_SHA512}  godot.zip" | shasum -a 512 -c -
          unzip -q godot.zip
          printf '#!/bin/sh\nexec "%s/Godot.app/Contents/MacOS/Godot" "$@"\n' "${PWD}" | sudo tee /usr/local/bin/godot >/dev/null
          sudo chmod +x /usr/local/bin/godot

      - name: ⬇️ Install export templates (pinned, checksum-verified)
        run: |
          set -euo pipefail
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          echo "${GODOT_TEMPLATES_SHA512}  templates.tpz" | shasum -a 512 -c -
          unzip -q templates.tpz
          mkdir -p "${HOME}/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mv templates/* "${HOME}/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable/"

      - name: 🧩 Headless import + class-name scan
        # Only the headless editor pass writes global_script_class_cache.cfg;
        # exporting without it breaks class_name resolution in packed scripts.
        run: |
          set -o pipefail
          godot --headless --editor --quit --path client 2>&1 | tee import.log

      - name: 🏗️ Export .app (release, ad-hoc signed)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          set -o pipefail
          mkdir -p build
          godot --headless --export-release "macOS" "${PWD}/build/WorldAtRuin-${VERSION}-macOS-universal.zip" --path client 2>&1 | tee export.log
          if grep -qE "SCRIPT ERROR|^ERROR" export.log import.log; then
            echo "::error::Errors during export"; exit 1
          fi
          test -s "build/WorldAtRuin-${VERSION}-macOS-universal.zip"

      - name: 🚦 Verify the EXPORTED app boots AND reports the release version
        # Boot the shipped artifact, not the editor build. BOOT_OK is main.gd's
        # positive marker that the world actually built; asserting the version
        # in that same line is what proves the stamp above reached the packed
        # binary rather than merely the working tree.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          set -o pipefail
          unzip -q "build/WorldAtRuin-${VERSION}-macOS-universal.zip" -d build/app
          "build/app/World at Ruin.app/Contents/MacOS/World at Ruin" --headless --quit-after 60 2>&1 | tee exported-smoke.log
          if grep -qE "SCRIPT ERROR|^ERROR" exported-smoke.log; then
            echo "::error::Errors booting the exported app"; exit 1
          fi
          if ! grep -q "BOOT_OK v${VERSION} " exported-smoke.log; then
            echo "::error::exported app did not report BOOT_OK v${VERSION} — the release version did not reach the shipped build"
            tail -20 exported-smoke.log
            exit 1
          fi

      - name: 🧾 Record the artifact checksum
        id: sha
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          SHA=$(shasum -a 256 "build/WorldAtRuin-${VERSION}-macOS-universal.zip" | cut -d' ' -f1)
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA}"

      - name: 🧾 Emit the update manifest
        id: manifest
        # What this build reads, writes and speaks — derived from the constants
        # the build actually runs on, never restated by hand here. A manifest
        # written in this script would drift silently from the client, and every
        # no-stranding guarantee of the product law is decided from these numbers.
        #
        # RUN HERE, NOT IN THE GHCR JOB: the manifest is derived from
        # `DevLog.VERSION`, which the stamp step above wrote into THIS checkout.
        # `publish-ghcr` has no checkout and no Godot, so it has nothing to
        # derive from and could only restate.
        #
        # THE ENVELOPE IS A PUBLICATION FACT. `sequence` and `not_after` cannot
        # come from the build without conflating SemVer with the anti-replay
        # counter or making identical builds nondeterministic, so the publisher
        # supplies them — and both are derived from ONE captured instant so they
        # cannot disagree.
        #
        # SEQUENCE COMES FROM THE VERSION, NOT A CLOCK, and the reasoning is in
        # tools/manifest-sequence.sh. Briefly: this workflow's concurrency group
        # is scoped per tag, so two releases run concurrently, and a mark sampled
        # from each runner's own clock can be inverted by whichever run reaches
        # `oras tag ... latest` last. The version is already the publication
        # order, so ordering by it cannot be raced.
        #
        # NOT_AFTER IS +24h, matching the shape reference in
        # docs/design/client-update-manifest.example.json. It is not decoration:
        # the ADR derives the server's protocol-CONTRACTION schedule from it —
        # a contraction may only happen once every manifest advertising the old
        # range has expired — so shortening it shortens that wait and lengthening
        # it lengthens it. A clock is the RIGHT source for an expiry, which is a
        # real instant, and the wrong one for an ordering.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          set -o pipefail
          SEQUENCE=$(./tools/manifest-sequence.sh "${VERSION}")
          # BSD `date -r <epoch>`: this job runs on macOS.
          NOT_AFTER=$(date -u -r "$(( $(date -u +%s) + 86400 ))" +%Y-%m-%dT%H:%M:%SZ)
          echo "sequence=${SEQUENCE} not_after=${NOT_AFTER}"
          WAR_MANIFEST_SEQUENCE="${SEQUENCE}" \
          WAR_MANIFEST_NOT_AFTER="${NOT_AFTER}" \
          WAR_MANIFEST_OUT="${PWD}/build/update-manifest.json" \
            godot --headless --path client res://tools/update_manifest_emit.tscn 2>&1 | tee manifest.log
          # The emitter exits non-zero and writes nothing on any refusal, and
          # `pipefail` above carries that through `tee`. This second check is for
          # the case the pipeline cannot see: a Godot that reports success while
          # a script error scrolled past, which is how the export step upstream
          # is guarded too.
          if ! grep -q "MANIFEST OK" manifest.log; then
            echo "::error::the update manifest was not emitted — publishing a build with no contract"
            tail -20 manifest.log
            exit 1
          fi
          test -s build/update-manifest.json
          # Prove it is parseable JSON before it is ever pushed. A manifest the
          # origin serves but no client can parse is the one failure this job
          # can still catch cheaply.
          jq -e . build/update-manifest.json > /dev/null
          # Published across the job boundary for the same reason the zip's is:
          # the GHCR job signs whatever it receives, so without this a truncated
          # or swapped transfer would be signed as though it were what we emitted.
          SHA=$(shasum -a 256 build/update-manifest.json | cut -d' ' -f1)
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"
          echo "manifest: $(wc -c < build/update-manifest.json) bytes, sha256=${SHA}"

      - name: 📎 Hand the build to the GHCR job
        # The GHCR job cannot read the release: it is still a DRAFT at that
        # point, and GitHub only exposes draft releases to tokens with PUSH
        # access ("Only users with push access will receive listings for draft
        # releases"; get-by-tag is documented as returning a *published*
        # release). Passing the file as a workflow artifact keeps that job on
        # `contents: read` instead of widening it to write purely to read back
        # what we just built — and it is the same file object, so byte-identity
        # with the release asset holds by construction rather than by a
        # round-trip that could itself go wrong.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-macos-universal
          path: build/WorldAtRuin-${{ steps.version.outputs.version }}-macOS-universal.zip
          if-no-files-found: error
          retention-days: 1

      - name: 📎 Hand the update manifest to the GHCR job
        # ITS OWN ARTIFACT, deliberately, rather than a second path on the one
        # above. `release-credential-boundary` pins that artifact's path to the
        # canonical zip EXACTLY, because that pin is what proves the build job
        # hands its output over instead of attaching the release itself. Adding
        # a path there would have meant widening a security guard to fit a
        # feature; a separate artifact leaves the guard untouched.
        #
        # It also keeps the manifest out of `attach-release`, which downloads
        # the canonical artifact into `build/` and has no business holding a
        # file it does not publish.
        #
        # Still the same file object the GHCR job pushes, so what gets signed is
        # what was emitted rather than something regenerated there.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-update-manifest
          path: build/update-manifest.json
          if-no-files-found: error
          retention-days: 1

  attach-release:
    name: 📤 Attach macOS build to release
    # This job is the credential boundary between repo-controlled build/runtime
    # code and the release-write token. It never checks out or executes the tag;
    # it only receives the inert build artifact and attaches it to the draft.
    needs: [publish-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # attach the completed artifact to the draft release
    steps:
      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: 📎 Receive the macOS build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: client-macos-universal
          path: build

      - name: ⏳ Wait for the draft release to exist
        # semantic-release pushes the tag (which triggered this run) BEFORE its
        # github plugin creates the draft release, so the draft can lag this
        # workflow by a few seconds. Poll rather than assume; fail closed with a
        # clear message if it never appears, so a missing draft can never be
        # mistaken for a successful publish.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json tagName >/dev/null 2>&1; then
              echo "release ${TAG} is present"
              exit 0
            fi
            sleep 10
          done
          echo "::error::no release found for ${TAG} after 5 minutes — semantic-release should have created it as a draft (.releaserc draftRelease). Nothing was published."
          exit 1

      - name: 📤 Attach the build to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          if ! printf '%s' "${TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-.+)?$'; then
            echo "::error::'${TAG}' is not a vX.Y.Z release tag"
            exit 1
          fi

          # Query draft state separately and retry transient API failures. A
          # failed query must never be misreported as an immutable release.
          IS_DRAFT=""
          for attempt in 1 2 3; do
            if IS_DRAFT="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft')"; then
              break
            fi
            IS_DRAFT=""
            [ "${attempt}" -lt 3 ] && sleep 5
          done

          if [ -z "${IS_DRAFT}" ]; then
            echo "::error::could not read the draft state of ${TAG} after 3 attempts. Nothing was published; ${TAG} is unchanged. This is a failed API call, NOT a published release — re-run this workflow."
            exit 1
          fi

          if [ "${IS_DRAFT}" != "true" ]; then
            echo "::error::${TAG} is already published — assets cannot be attached to an immutable release. The release must still be a draft when CD runs (see .releaserc draftRelease)."
            exit 1
          fi

          ASSET="build/WorldAtRuin-${TAG#v}-macOS-universal.zip"
          if [ ! -f "${ASSET}" ]; then
            echo "::error::${ASSET} does not exist — the build job did not hand off the expected artifact."
            exit 1
          fi

          # Retain the release-upload retry budget: a transient upload failure
          # strands an otherwise-complete immutable release as a draft.
          ATTEMPTS=5
          DELAY=15
          for attempt in $(seq 1 "${ATTEMPTS}"); do
            if gh release upload "${TAG}" "${ASSET}" \
              --repo "${GITHUB_REPOSITORY}" --clobber; then
              if [ "${attempt}" -gt 1 ]; then
                echo "uploaded ${ASSET} to ${TAG} on attempt ${attempt}/${ATTEMPTS}"
              fi
              exit 0
            fi
            if [ "${attempt}" -lt "${ATTEMPTS}" ]; then
              echo "attempt ${attempt}/${ATTEMPTS} to upload ${ASSET} failed; retrying in ${DELAY}s"
              sleep "${DELAY}"
              DELAY=$((DELAY * 2))
            fi
          done
          echo "::error::failed to attach ${ASSET} to ${TAG} after ${ATTEMPTS} attempts. Nothing was published; ${TAG} is still a draft."
          exit 1

  publish-ghcr:
    name: 📦 Publish OCI artifact to GHCR
    # The ORIGIN OF RECORD for the in-client updater (docs/design/
    # distribution-and-self-update.md, #62). The GitHub Release asset is a plain
    # HTTP download with no content addressing; the updater pins a DIGEST, which
    # is what an OCI registry gives us.
    #
    # Why OCI and not some other GitHub Packages registry: there isn't one.
    # GitHub Packages' registries (npm, NuGet, Maven, RubyGems) are all
    # ecosystem-specific and none accepts an arbitrary binary, so an OCI
    # artifact via ghcr.io is the only way a .app zip enters GitHub Packages.
    #
    # Runs on ubuntu (not the macOS runner that built it) and re-downloads the
    # published asset: this job needs no Godot toolchain, and pulling the
    # RELEASE asset — rather than a runner-local file — proves we publish
    # exactly the bytes a player would download.
    # Preserve the old fail-closed sequence: never expose an OCI update until
    # the same build has been attached successfully to its draft release.
    needs: [publish-macos, attach-release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # download the published release asset
      packages: write # push the OCI artifact
      id-token: write # keyless cosign signing via GitHub OIDC
    steps:
      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: 🏷️ Resolve the release version
        id: version
        env:
          RAW_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          if ! printf '%s' "${RAW_TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-.+)?$'; then
            echo "::error::'${RAW_TAG}' is not a vX.Y.Z release tag"
            exit 1
          fi
          echo "tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${RAW_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: ⬇️ Fetch the build from the macOS job
        # Deliberately NOT `gh release download`: the release is still a draft
        # here, and draft releases are only visible to tokens with push access —
        # this job has `contents: read` by design and should not be widened to
        # write just to read back a file we already built.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: client-macos-universal
          path: oci

      - name: ⬇️ Fetch the update manifest from the macOS job
        # Into the SAME directory, because `oras push` takes its layer paths
        # relative to one working directory — the build and the contract
        # describing it are pushed as one artifact.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: client-update-manifest
          path: oci

      - name: 🧾 Confirm the build matches what was attached to the release
        # The upstream job's checksum, asserted across the job boundary — so a
        # truncated or swapped artifact transfer fails here rather than silently
        # publishing different bytes to GHCR than the release carries.
        env:
          VERSION: ${{ steps.version.outputs.version }}
          EXPECTED: ${{ needs.publish-macos.outputs.sha256 }}
        run: |
          set -euo pipefail
          cd oci
          ACTUAL=$(sha256sum "WorldAtRuin-${VERSION}-macOS-universal.zip" | cut -d' ' -f1)
          if [ -z "${EXPECTED}" ]; then
            echo "::error::no checksum was published by the build job — cannot prove the artifact is the released build"
            exit 1
          fi
          if [ "${ACTUAL}" != "${EXPECTED}" ]; then
            echo "::error::artifact checksum mismatch — build job produced ${EXPECTED}, this job received ${ACTUAL}"
            exit 1
          fi
          echo "${ACTUAL}  WorldAtRuin-${VERSION}-macOS-universal.zip" > ../release-asset.sha256
          echo "checksum matches the build attached to the release: ${ACTUAL}"

      - name: 🧾 Confirm the update manifest crossed the job boundary intact
        # The manifest is signed by the same digest as the build, so it gets the
        # same proof the build gets. Signing a manifest this job cannot show is
        # the one it was handed would attest to bytes nobody checked.
        env:
          EXPECTED: ${{ needs.publish-macos.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          cd oci
          if [ -z "${EXPECTED}" ]; then
            echo "::error::no manifest checksum was published by the build job — cannot prove the manifest is the one emitted from the build"
            exit 1
          fi
          ACTUAL=$(sha256sum update-manifest.json | cut -d' ' -f1)
          if [ "${ACTUAL}" != "${EXPECTED}" ]; then
            echo "::error::manifest checksum mismatch — build job emitted ${EXPECTED}, this job received ${ACTUAL}"
            exit 1
          fi
          echo "${ACTUAL}  update-manifest.json" > ../manifest.sha256
          echo "checksum matches the manifest emitted from the build: ${ACTUAL}"

      - name: 🔧 Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: 🔏 Set up cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: 🔐 Log in to GHCR
        uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4.5.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ env.GH_TOKEN }}

      - name: 📦 Push the OCI artifact
        id: push
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          # BEGIN ghcr-latest-forward-helper
          release_version_key() {
            local release="$1"
            local major minor patch rest component

            if [[ ! "${release}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              return 1
            fi
            major="${release%%.*}"
            rest="${release#*.}"
            minor="${rest%%.*}"
            patch="${rest##*.}"
            for component in "${major}" "${minor}" "${patch}"; do
              # The manifest sequence uses the same six-digit component bound.
              # Keeping the key inside that contract makes lexical comparison
              # exact without depending on GNU sort -V.
              if [ "${#component}" -gt 6 ]; then
                return 1
              fi
            done
            printf '%06d%06d%06d\n' "${major}" "${minor}" "${patch}"
          }

          newest_release_tag() {
            local artifact="$1"
            local published="$2"
            local tags tag key newest newest_key

            if ! newest_key="$(release_version_key "${published}")"; then
              echo "::error::published version '${published}' is outside the stable release contract"
              return 1
            fi
            newest="${published}"
            if ! tags="$(oras repo tags "${artifact}")"; then
              echo "::error::could not read immutable release tags for ${artifact}"
              return 1
            fi
            while IFS= read -r tag; do
              if ! key="$(release_version_key "${tag}")"; then
                continue
              fi
              if [[ "${key}" > "${newest_key}" ]]; then
                newest="${tag}"
                newest_key="${key}"
              fi
            done <<<"${tags}"
            printf '%s\n' "${newest}"
          }

          latest_release_version() {
            local artifact="$1"
            oras manifest fetch "${artifact}:latest" 2>/dev/null |
              jq -er '.annotations["org.opencontainers.image.version"] // empty'
          }

          advance_latest_tag() {
            local artifact="$1"
            local published="$2"
            local attempts=0
            local newest current newest_key current_key

            # Re-read after every write. If a newer immutable version appears
            # while this run is tagging, the next pass repairs latest to that
            # version rather than returning after a stale read-then-write.
            while [ "${attempts}" -lt 5 ]; do
              attempts=$((attempts + 1))
              newest="$(newest_release_tag "${artifact}" "${published}")" ||
                return 1
              current=""
              current="$(latest_release_version "${artifact}")" || current=""
              if [ -n "${current}" ]; then
                if ! current_key="$(release_version_key "${current}")"; then
                  echo "::error::latest exposes unorderable version '${current}'; refusing to replace it"
                  return 1
                fi
                newest_key="$(release_version_key "${newest}")"
                if [[ "${current_key}" > "${newest_key}" ]]; then
                  newest="${current}"
                fi
              fi
              if [ "${current}" = "${newest}" ]; then
                if [ "${published}" = "${newest}" ]; then
                  echo "latest already exposes ${newest}"
                else
                  echo "left latest at newer ${newest}; ${published} cannot move it backward"
                fi
                return 0
              fi
              oras tag "${artifact}:${newest}" latest
              echo "advanced latest to ${newest}"
            done

            newest="$(newest_release_tag "${artifact}" "${published}")" ||
              return 1
            current=""
            current="$(latest_release_version "${artifact}")" || current=""
            if [ -n "${current}" ]; then
              if ! current_key="$(release_version_key "${current}")"; then
                echo "::error::latest exposes unorderable version '${current}'; refusing to replace it"
                return 1
              fi
              newest_key="$(release_version_key "${newest}")"
              if [[ "${current_key}" > "${newest_key}" ]]; then
                newest="${current}"
              fi
            fi
            if [ "${current}" != "${newest}" ]; then
              echo "::error::latest did not converge to newest release ${newest} (found '${current}')"
              return 1
            fi
          }
          # END ghcr-latest-forward-helper

          # Registry paths must be lowercase. `tr` rather than bash's ${VAR@L}
          # so this does not silently depend on bash >= 4.4.
          ARTIFACT="$(printf 'ghcr.io/%s/client' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          cd oci
          # Push the immutable bare version first. `latest` is advanced only
          # after the registry's complete stable-version set can be compared.
          # The manifest is a SECOND LAYER of this artifact, not a second tag:
          # one digest then covers the build and the contract describing it, so
          # `cosign verify` attests to both at once and there is no second thing
          # to keep in sync. A separate tag could be updated independently, which
          # is precisely how a manifest comes to describe a build it does not ship
          # with.
          oras push "${ARTIFACT}:${VERSION}" \
            --artifact-type application/vnd.devantler.worldatruin.client.v1+zip \
            --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.version=${VERSION}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            "WorldAtRuin-${VERSION}-macOS-universal.zip:application/zip" \
            "update-manifest.json:application/vnd.devantler.worldatruin.client.manifest.v1+json"
          advance_latest_tag "${ARTIFACT}" "${VERSION}"
          # `oras manifest fetch --descriptor` rather than `oras resolve`: the
          # latter is marked [Preview] and `--format` is [Experimental], so both
          # can change under us. This form is stable.
          DIGEST=$(oras manifest fetch --descriptor "${ARTIFACT}:${VERSION}" | jq -r '.digest')
          if ! printf '%s' "${DIGEST}" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::could not resolve a digest for ${ARTIFACT}:${VERSION} (got '${DIGEST}')"
            exit 1
          fi
          echo "artifact=${ARTIFACT}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "pushed ${ARTIFACT}:${VERSION} @ ${DIGEST}"

      - name: 🔏 Sign the artifact by digest
        env:
          ARTIFACT: ${{ steps.push.outputs.artifact }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          # Sign the DIGEST, never the mutable tag — the digest is what the
          # updater pins, so it is what the signature must cover.
          cosign sign --yes "${ARTIFACT}@${DIGEST}"

      - name: ✅ Verify signature and byte-identity
        env:
          ARTIFACT: ${{ steps.push.outputs.artifact }}
          DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cosign verify "${ARTIFACT}@${DIGEST}" \
            --certificate-identity-regexp "^${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            > /dev/null
          echo "signature verified for ${ARTIFACT}@${DIGEST}"
          # Pull the artifact back and prove the stored bytes match the release
          # asset exactly. A push that silently truncated or re-encoded would
          # otherwise ship a build nobody had checked.
          mkdir -p pulled && cd pulled
          oras pull "${ARTIFACT}@${DIGEST}"
          sha256sum -c <(sed "s#  .*#  WorldAtRuin-${VERSION}-macOS-universal.zip#" ../release-asset.sha256)
          echo "pulled bytes are identical to the release asset"
          # The manifest gets the same pull-back proof. Checked against the sha
          # the BUILD job emitted rather than the copy in this workspace, so a
          # push that re-encoded the JSON fails here instead of shipping a
          # contract whose signed bytes nobody can reproduce.
          sha256sum -c ../manifest.sha256
          echo "pulled manifest is byte-identical to the one emitted from the build"

    outputs:
      artifact: ${{ steps.push.outputs.artifact }}
      digest: ${{ steps.push.outputs.digest }}

  verify-ghcr-public:
    name: 🌍 Verify GHCR is anonymously pullable
    # THE check that matters for a player-facing origin, and the easiest one to
    # fake: every step in publish-ghcr runs authenticated (docker/login-action +
    # GITHUB_TOKEN), so none of them prove public reachability. GHCR creates
    # packages PRIVATE by default and that failure is invisible from the
    # publishing side — the push succeeds and only the player gets a 401. So
    # this job deliberately uses NO credentials at all: no login step, no token.
    # "Fix" it by adding credentials and you have restored a guard that passes
    # vacuously.
    #
    # DELIBERATELY NOT A DEPENDENCY OF publish-release (maintainer direction
    # 2026-07-18). Nothing consumes GHCR yet — the in-client updater is not
    # wired to it — so a private package harms no player today, whereas blocking
    # every release on it would. This job going red is the loud signal; the
    # release still ships. **Make this blocking the moment the updater actually
    # resolves against GHCR** (tracked as #141): from then on, a
    # release whose update origin is unreachable is a real defect.
    needs: [publish-ghcr]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {} # no credentials by design
    steps:
      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: 🌍 Anonymous pull check
        env:
          ARTIFACT: ${{ needs.publish-ghcr.outputs.artifact }}
          DIGEST: ${{ needs.publish-ghcr.outputs.digest }}
        run: |
          set -euo pipefail
          # Strip the registry host to get the repository path for the token/v2 API.
          REPO_PATH="${ARTIFACT#ghcr.io/}"
          # Anonymous pull token — no Authorization header, no docker config.
          TOKEN=$(curl -fsS "https://ghcr.io/token?scope=repository:${REPO_PATH}:pull&service=ghcr.io" | jq -r '.token')
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.oci.image.manifest.v1+json,application/vnd.oci.image.index.v1+json" \
            "https://ghcr.io/v2/${REPO_PATH}/manifests/${DIGEST}")
          echo "anonymous manifest fetch: HTTP ${CODE}"
          if [ "${CODE}" != "200" ]; then
            echo "::error::${ARTIFACT} is NOT anonymously pullable (HTTP ${CODE}). GHCR packages are private by default, so a player's client cannot fetch updates from it. Fix: GitHub → Packages → world-at-ruin/client → Package settings → Change visibility → Public. The release itself still published (this check is intentionally non-blocking while nothing consumes GHCR), so nothing is broken for players today — but the update origin is not yet usable."
            exit 1
          fi
          echo "${ARTIFACT}@${DIGEST} is publicly reachable with no credentials"

  publish-release:
    name: 🚀 Publish the release
    # SEPARATE, LAST, AND DEPENDENT ON THE ARTIFACT JOBS. The draft becomes
    # public only once the build is attached AND the GHCR origin exists and is
    # signed. Publishing earlier would leave a public, immutable release whose
    # update origin does not exist — and since releases are immutable, that is
    # not repairable afterwards.
    #
    # This is the same shape the org's Go repos get from GoReleaser
    # (`release: draft: true` + publish only after every asset job succeeds).
    needs: [attach-release, publish-ghcr]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # flip the release out of draft
    steps:
      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: 🚀 Publish the release
        # Emits `published`, which is deliberately not a CD trigger, so this
        # cannot re-enter the workflow.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
          # Verify rather than trust the command's exit code.
          state=$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft,assets \
            --jq '"draft=\(.isDraft) assets=\(.assets|length)"')
          echo "${TAG}: ${state}"
          case "${state}" in
            "draft=false assets=0") echo "::error::${TAG} published with NO assets"; exit 1 ;;
            "draft=false assets="*) ;;
            *) echo "::error::${TAG} did not publish"; exit 1 ;;
          esac

  homebrew-cask:
    name: 🍺 Publish Homebrew cask
    # AFTER publish-release, not before: the cask's `url` points at the RELEASE
    # ASSET, and a draft release's asset URL 404s for `brew install`. Opening
    # the cask PR while the release is still a draft would publish a recipe that
    # cannot install.
    #
    # NOTE ON `auto_updates`: deliberately ABSENT. It tells Homebrew "this app
    # updates itself, do not upgrade it" — and World at Ruin has NO working
    # in-client updater yet (client/scripts/update_decision.gd is pure decision
    # logic; the Tier-1 pack pipeline of docs/design/distribution-and-self-update.md
    # is designed, not built). Declaring it now would make `brew upgrade` skip the
    # cask and strand every player on the version they installed. Add it only
    # once the self-updater actually ships (see #106).
    needs: [publish-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Serialize the tap handoff ACROSS tags. The workflow-level concurrency
    # group is per-tag so release builds can overlap, but this job mutates
    # shared tap state (the evergreen branch, ONE PR, its title, its
    # auto-merge arm), and every cross-run interleaving of
    # disarm→write→retitle→arm is a race: a preflight disarm check is a
    # TOCTOU the moment a sibling run can arm between the check and the
    # content PUT (Codex round 4 on #197; rounds 1–3 each found one more
    # such interleaving). One tap job at a time makes the sequence atomic
    # with respect to sibling releases and kills the family at the root; the
    # in-job convergence/disarm logic stays as defense against manual
    # actors. `queue: max` holds stacked releases FIFO, so every release's
    # handoff runs in tag order and none is dropped while pending; the
    # in-job monotonic compare-and-swap still guards against an out-of-order
    # or manual write landing on a newer version.
    concurrency:
      group: homebrew-tap-cask-world-at-ruin
      cancel-in-progress: false
      queue: max # pending runs wait FIFO; the default replaces them
    permissions:
      contents: read # read the published release asset
    steps:
      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: 🏷️ Resolve the release version
        id: version
        env:
          RAW_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          if ! printf '%s' "${RAW_TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-.+)?$'; then
            echo "::error::'${RAW_TAG}' is not a vX.Y.Z release tag"
            exit 1
          fi
          echo "tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${RAW_TAG#v}" >> "$GITHUB_OUTPUT"
          # Anchor for the tap step's REST wait deadline. Recorded HERE, in the
          # job's first scripted step, because `timeout-minutes` bounds the
          # whole JOB: a deadline measured from the tap step would start its
          # clock after the asset download, and a slow download would let the
          # runner kill the wait before the deliberate deadline error fires —
          # turning a loud, diagnosable failure into an anonymous timeout.
          echo "CASK_JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: 🔑 Require the tap token
        # Fail with a diagnosis rather than a bare auth error from `gh` later.
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN}" ]; then
            echo "::error::HOMEBREW_GITHUB_API_TOKEN is not available to this repository. The cask cannot be published to devantler-tech/homebrew-tap without it. The release itself is unaffected."
            exit 1
          fi

      - name: 🧮 Checksum the published asset
        id: asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          asset="WorldAtRuin-${VERSION}-macOS-universal.zip"
          # Download from the PUBLIC release URL, the same one the cask will use,
          # so a broken/404 URL fails here rather than in a player's `brew install`.
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/${asset}"
          curl -fsSL --retry 3 -o "$asset" "$url"
          {
            echo "sha256=$(sha256sum "$asset" | cut -d' ' -f1)"
            echo "asset=${asset}"
            echo "url=${url}"
          } >> "$GITHUB_OUTPUT"

      - name: 🍺 Render the cask
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.asset.outputs.sha256 }}
        run: |
          set -euo pipefail
          mkdir -p Casks
          cat > Casks/world-at-ruin.rb <<CASK
          # This file is generated by World at Ruin's CD workflow. DO NOT EDIT.
          cask "world-at-ruin" do
            version "${VERSION}"
            sha256 "${SHA256}"

            # No verified: parameter here. brew audit --strict rejects it when
            # the download domain matches the homepage domain, which it does
            # here (both github.com). ksail needs it only because its homepage
            # is a separate site.
            url "https://github.com/devantler-tech/world-at-ruin/releases/download/v#{version}/WorldAtRuin-#{version}-macOS-universal.zip"
            name "World at Ruin"
            desc "Cloud-native MMORPG built almost entirely by agents"
            homepage "https://github.com/devantler-tech/world-at-ruin/"

            livecheck do
              skip "Auto-generated on release."
            end

            depends_on macos: :big_sur

            app "World at Ruin.app"

            postflight do
              # The build is AD-HOC signed (Godot's built-in codesign, no
              # Developer ID), so Gatekeeper quarantines it on download and it
              # will not launch without this.
              system_command "/usr/bin/xattr",
                             args: ["-dr", "com.apple.quarantine", "#{appdir}/World at Ruin.app"]
            end

            uninstall quit: "tech.devantler.worldatruin"

            zap trash: "~/Library/Application Support/Godot/app_userdata/World at Ruin"
          end
          CASK
          echo "--- rendered cask ---"
          cat Casks/world-at-ruin.rb

      - name: 📤 Open, update, and arm the tap PR
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Evergreen branch: a new release updates the ONE open cask PR in place
          # rather than stacking a new PR per release (the tap convention).
          branch="goreleaser/world-at-ruin"
          tap="devantler-tech/homebrew-tap"
          content="$(base64 -w0 < Casks/world-at-ruin.rb)"

          # ONE deadline for every REST check-wait this job performs, however
          # many it turns out to need (see the delivery helper).
          #
          # Measured from the JOB's start, not this step's: `timeout-minutes`
          # bounds the job, so a step-relative deadline silently grows past it
          # whenever the earlier steps are slow — and the asset download is
          # both the slowest and the most variable of them (it retries). The
          # point of the deadline is a LOUD, diagnosable failure, and a runner
          # timeout that beats it to the punch is exactly what it is meant to
          # prevent. 13 minutes of the 15 leaves the merge call and step
          # teardown their headroom, and the budget correctly SHRINKS when the
          # earlier steps have already spent the job's time.
          #
          # The fallback keeps the helper usable if the anchor is ever missing
          # (a reordered or skipped step), at the original step-relative bound.
          if [ -n "${CASK_JOB_START:-}" ]; then
            cask_rest_deadline=$(( CASK_JOB_START + 780 ))
          else
            cask_rest_deadline=$(( $(date +%s) + 600 ))
          fi

          # A fork can use the same branch name, so never select a PR by ref
          # alone. Ask GitHub for the tap owner's head and then fail closed by
          # checking the returned PR's head repository and ref ourselves.
          trusted_open_pr() {
            gh api --method GET "repos/${tap}/pulls" \
              -f state=open -f "head=devantler-tech:${branch}" -f per_page=100 \
              | jq -r --arg tap "${tap}" --arg branch "${branch}" \
                '[.[] | select(.head.repo.full_name == $tap and .head.ref == $branch)] | .[0].number // empty'
          }

          # BEGIN cask-ref-visibility-helper
          wait_for_cask_ref() {
            local tap="$1"
            local branch="$2"
            local attempt
            for attempt in 1 2 3 4 5; do
              if gh api "repos/${tap}/git/ref/heads/${branch}" >/dev/null 2>&1; then
                return 0
              fi
              if [ "${attempt}" -lt 5 ]; then
                sleep 2
              fi
            done
            echo "::error::could not create or find ${branch} on ${tap}"
            return 1
          }
          # END cask-ref-visibility-helper

          # Helper: the cask version carried by a ref, empty when the file or
          # ref is missing. Defined here because the branch-reset guard below
          # needs it; also used by the PR-open and title-convergence blocks.
          cask_version_at() {
            gh api "repos/${tap}/contents/Casks/world-at-ruin.rb?ref=${1}" 2>/dev/null \
              | jq -r '.content // empty' | base64 -d 2>/dev/null \
              | sed -n 's/^  version "\(.*\)"$/\1/p' | head -1 || true
          }

          # BEGIN cask-rest-merge-helper
          # Deliver the cask WITHOUT GraphQL: wait for the checks auto-merge
          # would have waited for, then merge over REST.
          #
          # Arming is GraphQL-only — `enablePullRequestAutoMerge` has no REST
          # equivalent — so a run whose account's GraphQL budget is exhausted
          # cannot arm at all, and the release would otherwise fail over a quota
          # belonging to unrelated consumption elsewhere. That budget resets
          # hourly, far beyond this job's 15-minute timeout, so there is nothing
          # worth retrying: doing auto-merge's waiting here is what delivers.
          #
          # The gate is the tap's OWN REQUIRED CONTEXTS, read from the ruleset
          # that governs its main. Nothing weaker works. "Some check run exists
          # and none of the ones I can see are pending" is not the same claim:
          # runs are created asynchronously as workflows start, so a snapshot
          # taken moments after the PR moved can contain one fast completed run
          # and none of the rest, which reads as finished and merges before the
          # required workflows have even registered. A required context that has
          # not appeared yet is simply unsatisfied, so waiting is automatic.
          #
          # None of this is delegated to the merge endpoint: the tap token can
          # bypass rulesets, so GitHub would merge an unchecked head if asked.
          # The merge is pinned with `sha=` to the head whose evidence was read,
          # so a head pushed afterwards is refused rather than merged on someone
          # else's evidence — the same property the clean-status path relies on.
          #
          # Budget: the tap's cask PRs measured 2m00s-3m27s open-to-merge across
          # the four releases of 2026-07-28, so 20 reads at 20s (~6m40s) is about
          # twice the observed worst case and still fits the job timeout.
          # Exhausting it fails LOUDLY: checks that never finish are a real
          # problem, not a quota one.
          #
          # The per-call budget alone is NOT enough, because one job can take
          # this wait TWICE: once to clear a previously-armed PR that could not
          # be disarmed for quota, and again when the same exhausted budget
          # sends this run's own PR down the delivery path. Two full budgets is
          # 13m20s of a 15-minute job, before the asset download, ~160 API
          # reads and the conflict repair's own polling — so a slow-but-healthy
          # pair of PRs would hit the runner timeout with the new PR neither
          # armed nor delivered, which is the outcome this whole path exists to
          # prevent. Bound the two waits with ONE wall-clock deadline set at
          # step start, so their SUM is budgeted rather than each in isolation.
          # Unset (a test sourcing the helper alone) means no deadline.
          #
          # Returns 0 delivered, 2 the branch moved so the caller must re-derive
          # the title before delivering, 1 anything else.
          merge_cask_pr_when_green() {
            local tap="$1"
            local pr="$2"
            local branch="$3"
            local expected_version="$4"
            local attempt pr_state head runs statuses required verdict
            local declared returned failed_any unsatisfied

            # What the tap actually requires. Read ONCE: it is branch policy,
            # not per-head state. An unreadable or empty answer fails CLOSED —
            # "no required checks" and "the read failed" are indistinguishable
            # here, and merging on the second would bypass the gate entirely.
            required="$(gh api "repos/${tap}/rules/branches/main" 2>/dev/null \
              | jq -c '[.[] | select(.type == "required_status_checks")
                       | .parameters.required_status_checks[]?
                       | {context, integration_id}] | unique' 2>/dev/null || true)"
            case "${required}" in
              '' | 'null' | '[]')
                echo "::error::could not read the required status checks for ${tap} main; refusing to merge ${tap}#${pr} without knowing what the gate is"
                return 1
                ;;
            esac

            for attempt in $(seq 1 20); do
              # Shared wall-clock bound across every REST wait this job takes.
              # Checked at the TOP of the iteration so an already-expired
              # deadline costs no further reads.
              if [ "${cask_rest_deadline:-0}" -gt 0 ] \
                 && [ "$(date +%s)" -ge "${cask_rest_deadline}" ]; then
                echo "::error::${tap}#${pr} did not reach an all-green head before this job's shared REST delivery deadline; the cask is written and the PR is open, but it was not delivered"
                return 1
              fi
              pr_state="$(gh api "repos/${tap}/pulls/${pr}" 2>/dev/null || true)"
              if [ -n "${pr_state}" ] \
                 && [ "$(printf '%s' "${pr_state}" | jq -r '.merged' 2>/dev/null)" = "true" ]; then
                echo "${tap}#${pr} is already merged"
                return 0
              fi
              head="$(printf '%s' "${pr_state}" | jq -r '.head.sha // empty' 2>/dev/null || true)"
              case "${head}" in
                [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) : ;;
                *) head="" ;;
              esac
              if [ -n "${head}" ]; then
                # Check runs and legacy STATUSES are two separate surfaces and a
                # required context can live on either — the tap's heads carry a
                # `CodeRabbit` status that no check-run read can see.
                runs="$(gh api "repos/${tap}/commits/${head}/check-runs?per_page=100" 2>/dev/null || true)"
                statuses="$(gh api "repos/${tap}/commits/${head}/status" 2>/dev/null || true)"
                # One parse, so every number describes the same snapshot. An
                # unparsed payload yields nothing and is treated as a failed
                # read, never as a green one.
                verdict="$(jq -n -c -r \
                  --argjson req "${required}" \
                  --slurpfile runsdoc <(printf '%s' "${runs}") \
                  --slurpfile stdoc <(printf '%s' "${statuses}") '
                  def passed: .status == "completed"
                    and (.conclusion == "success"
                         or .conclusion == "neutral"
                         or .conclusion == "skipped");
                  # A requirement is identified by BOTH its context and, when
                  # the ruleset pins one, the integration that must produce it.
                  # Matching the name alone would let a same-named check from
                  # another producer satisfy a requirement this token can then
                  # merge past. A legacy status carries no integration id at
                  # all, so a pinned requirement is never satisfiable by one.
                  def produced_by($c): $c.integration_id == null
                    or (.app.id == $c.integration_id);
                  ($runsdoc[0].check_runs // []) as $r
                  | ($stdoc[0].statuses // []) as $s
                  | [ ($runsdoc[0].total_count // -1),
                      ($r | length),
                      ([$r[] | select(.status == "completed") | select(passed | not)] | length),
                      ([ $req[] as $c
                         | select((([$r[] | select(.name == $c.context)
                                          | select(produced_by($c))
                                          | select(passed)] | length) == 0)
                                  and (([$s[] | select($c.integration_id == null)
                                              | select(.context == $c.context)
                                              | select(.state == "success")] | length) == 0))
                       ] | length)
                    ] | @tsv' 2>/dev/null || true)"
                declared=""; returned=""; failed_any=""; unsatisfied=""
                case "${verdict}" in
                  [0-9]*[[:space:]][0-9]*[[:space:]][0-9]*[[:space:]][0-9]*)
                    read -r declared returned failed_any unsatisfied <<<"${verdict}"
                    ;;
                esac
                # `failed_any` and the required-context scan are computed over
                # the runs this page RETURNED, so a head with more check runs
                # than the page holds would be judged on a fraction of its own
                # evidence. That fails OPEN, the wrong direction for a merge the
                # tap token can push past its own rulesets. The tap runs ~13
                # checks, so this is headroom rather than a live case; refuse
                # loudly rather than paginate, so if it ever fires it says so.
                if [ -n "${declared}" ] && [ -n "${returned}" ] \
                   && [ "${declared}" != "${returned}" ]; then
                  echo "::error::${tap}#${pr} reports ${declared} check run(s) at ${head} but the page returned ${returned}; refusing to judge a partial page"
                  return 1
                fi
                # NOTE: a review provider that is quota-blocked is NOT treated
                # as satisfying a required context. Elsewhere this deployment
                # classifies a provider's own quota status as a service state
                # rather than a verdict, and that remains right for deciding
                # whether OUR PRs are mergeable — but here the tap itself lists
                # the context as required and this token can merge past its
                # ruleset, so excusing it would silently bypass the tap's own
                # policy. If a provider should not gate the tap, the ruleset is
                # the place to say so. Fail closed instead.
                #
                # Stricter than auto-merge, deliberately: a FAILING check on a
                # machine-generated cask PR is abnormal even when that check is
                # not required, and stopping loudly is a better error than
                # shipping past it.
                if [ -n "${failed_any}" ] && [ "${failed_any}" -gt 0 ]; then
                  echo "::error::${tap}#${pr} carries ${failed_any} failing check(s) at ${head}; refusing to merge it"
                  return 1
                fi
                if [ -n "${unsatisfied}" ] && [ "${unsatisfied}" -eq 0 ]; then
                  # The tap squash-merges on the PR TITLE, and that title was
                  # derived from the branch BEFORE this wait began. Waiting for
                  # checks holds that derivation open for minutes rather than
                  # milliseconds, so a writer landing on the shared branch
                  # meanwhile would have its content merged under the previous
                  # version's changelog entry — the lying-title hazard the
                  # arming path re-reads for, and it must not return here.
                  # Prove it as late as possible, never from a pre-wait value.
                  if [ "$(cask_version_at "${branch}")" != "${expected_version}" ]; then
                    echo "::notice::${branch} moved to a different version while waiting for ${tap}#${pr}'s checks; re-deriving the title before delivering"
                    return 2
                  fi
                  if gh api -X PUT "repos/${tap}/pulls/${pr}/merge" \
                       -f merge_method=squash -f sha="${head}" >/dev/null 2>&1; then
                    echo "merged ${tap}#${pr} over REST at ${head} — every required context green"
                    return 0
                  fi
                  # Refused: the head moved between reading the evidence and the
                  # merge, so that evidence no longer describes what would be
                  # merged. Re-read and re-decide rather than retrying blind.
                  echo "::notice::${tap}#${pr} moved while merging at ${head}; re-reading (attempt ${attempt})"
                fi
              fi
              if [ "${attempt}" != "20" ]; then
                sleep 20
              fi
            done
            echo "::error::${tap}#${pr} did not reach an all-green head within the REST merge budget; the cask is written and the PR is open, but it was not delivered"
            return 1
          }
          # END cask-rest-merge-helper

          # BEGIN cask-branch-reset-helper
          # The tap SQUASH-merges, so merging a cask PR puts a new, non-ancestor
          # commit on the tap's main touching Casks/world-at-ruin.rb — the exact
          # file every subsequent release rewrites. This evergreen branch is
          # seeded from main only when absent, so once it exists it is never
          # re-synced and the NEXT release's PR is born CONFLICTING and can
          # never auto-merge: releases keep being cut while the tap silently
          # stays pinned at the last merged version.
          #
          # Two conditions gate the reset, and both are load-bearing:
          #
          #   1. NO open trusted PR. Resetting under a live PR would discard an
          #      in-flight release that has already been published.
          #   2. The branch is BEHIND main. `behind_by > 0` is precisely "main
          #      moved on without us", which IS the conflict condition — and it
          #      is what keeps a concurrent release safe: a run that has written
          #      content but not yet opened its PR leaves the branch AHEAD only
          #      (behind_by == 0), so its write is never thrown away here. The
          #      monotonic compare-and-swap below then settles which version
          #      wins, exactly as it does today.
          #
          # An unreadable comparison fails CLOSED — leave the branch alone and
          # let the existing conflict surface rather than force-writing a ref on
          # a guess.
          cask_branch_needs_reset() {
            local tap="$1"
            local branch="$2"
            local open_pr="$3"
            local behind branch_version main_version
            if [ -n "${open_pr}" ]; then
              return 1
            fi
            behind="$(gh api "repos/${tap}/compare/main...${branch}" \
              --jq '.behind_by' 2>/dev/null || true)"
            case "${behind}" in
              '' | *[!0-9]*) return 1 ;;
            esac
            if [ "${behind}" -le 0 ]; then
              return 1
            fi
            # `ahead_by` is deliberately NOT the discriminator. The tap
            # squash-merges, so after a merge the branch KEEPS its own commits
            # while main gains a non-ancestor squash: DIVERGED (ahead>0 AND
            # behind>0) is the normal, expected shape of the very state this
            # reset exists to clear — the reported case measured 4 ahead, 1
            # behind. Refusing to reset a diverged branch would therefore make
            # this a no-op in exactly the scenario it targets.
            #
            # What must never be discarded is content the branch carries that
            # main has NOT received. That is a question about the CASK VERSION,
            # not the commit graph: once a cask PR merges, the branch and main
            # name the same version, whereas a concurrent run that has written
            # but not yet opened its PR leaves the branch naming a version main
            # does not have. Refuse whenever they disagree — that fails closed
            # for an undelivered write in either direction.
            branch_version="$(cask_version_at "${branch}")"
            main_version="$(cask_version_at main)"
            # BOTH reads must succeed. cask_version_at collapses an API,
            # decode or parse failure into the same empty string it returns for
            # a genuinely absent file, so accepting empty here would turn a
            # transient read failure into permission to force-reset — throwing
            # away a newer version before the monotonic guard downstream ever
            # sees it, and leaving Homebrew pinned behind.
            if [ -z "${branch_version}" ] || [ -z "${main_version}" ]; then
              return 1
            fi
            if [ "${branch_version}" != "${main_version}" ]; then
              return 1
            fi
            return 0
          }
          # END cask-branch-reset-helper

          base_sha="$(gh api "repos/${tap}/git/ref/heads/main" --jq '.object.sha')"
          # Tolerate a concurrent creator: two runs can both see the branch
          # missing and race this POST; the loser gets 422 and must NOT die
          # under `set -e` before reaching the compare-and-swap below. GitHub
          # can acknowledge the create before the ref is immediately visible
          # to a following GET, so use a bounded read-after-create wait.
          if ! gh api "repos/${tap}/git/ref/heads/${branch}" >/dev/null 2>&1; then
            gh api "repos/${tap}/git/refs" -X POST -f ref="refs/heads/${branch}" \
              -f sha="${base_sha}" >/dev/null 2>&1 || true
            wait_for_cask_ref "${tap}" "${branch}"
          elif cask_branch_needs_reset "${tap}" "${branch}" \
               "$(trusted_open_pr || echo UNKNOWN)"; then
            # A fresh cycle on a branch left stale by the previous merge. Read
            # the open-PR state HERE rather than reusing an earlier read, so the
            # "no live PR" proof is as close to the write as it can be.
            #
            # `|| echo UNKNOWN` is load-bearing: the query pipeline yields an
            # empty string BOTH when no PR is open and when the API call fails,
            # and those must not mean the same thing here. A transient failure
            # while a PR really is open would otherwise read as "safe to reset"
            # and discard that in-flight release. Any non-empty value refuses
            # the reset, so an unreadable PR state fails closed like an
            # unreadable comparison does.
            # Re-read main HERE rather than reusing the base_sha captured
            # before the comparison and PR checks: if another cask PR merged in
            # that window, resetting to the older sha lands the branch behind
            # again and recreates the conflict this is meant to remove. Capture
            # and shape-check it instead of inlining the call — an empty or
            # partial response must not become the target of a force update.
            reset_sha="$(gh api "repos/${tap}/git/ref/heads/main" \
              --jq '.object.sha' 2>/dev/null || true)"
            case "${reset_sha}" in
              [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) : ;;
              *) reset_sha="" ;;
            esac
            # ABORT rather than continue when the reset cannot be completed.
            # Continuing is NOT merely "today's behaviour": reaching here means
            # the branch is known behind with no open PR, so writing the cask
            # anyway opens a PR that is born CONFLICTING — and because that PR
            # then stays open, every later cycle's open-PR guard suppresses the
            # reset, so the tap can never recover on its own. Failing leaves no
            # PR behind, which keeps the next release's reset path viable; the
            # release itself is already published by this point, so the cost is
            # a retryable cask handoff rather than a stuck tap.
            if [ -z "${reset_sha}" ]; then
              echo "::error::could not re-read ${tap} main before resetting ${branch}; refusing to open a PR from a known-behind branch"
              exit 1
            fi
            reset_done=""
            for attempt in 1 2 3; do
              if gh api "repos/${tap}/git/refs/heads/${branch}" -X PATCH \
                   -f sha="${reset_sha}" -F force=true >/dev/null 2>&1; then
                reset_done=1
                break
              fi
              if [ "${attempt}" != "3" ]; then
                sleep 3
              fi
            done
            if [ -z "${reset_done}" ]; then
              echo "::error::could not reset ${branch} to ${tap} main (${reset_sha}) after 3 attempts; refusing to open a PR from a known-behind branch, which would be born conflicted and block every later reset"
              exit 1
            fi
            echo "::notice::reset ${branch} to ${tap} main (${reset_sha}) — the previous cask PR merged and left it behind"
          fi

          # BEGIN cask-disarm-helper
          # DISARM before touching the branch. Auto-merge armed by a previous
          # release survives pushes, so if this job died between the content
          # PUT below and the title-convergence loop, GitHub would finish the
          # new head's checks and squash-merge it under the PREVIOUS
          # version's title — with no process left to repair the changelog.
          # Disarmed, a crash merely leaves the PR unmerged until the next
          # run's convergence loop re-arms it (the recovery path below).
          #
          # The invariant is "nothing is ARMED when the new content lands", and
          # disarming is only one way to reach it. Disarming has no REST
          # equivalent at all, so when the mutation is refused because the
          # shared tap account's GraphQL budget is exhausted, DELIVER the armed
          # PR instead: waiting for its checks and merging it removes the PR
          # altogether, which satisfies the same invariant more strongly than
          # disarming does. Its title was converged against the content it
          # carries, so the squash lands the changelog entry it was written for,
          # and the previous release reaches the tap rather than being discarded.
          # The branch it leaves behind is then behind main, which the
          # conflict-repair path below already exists to rebuild.
          #
          # Every OTHER refusal still fails closed before the write. A quota is
          # a property of unrelated consumption on a shared account; a
          # permission or node error is a real problem, and writing new content
          # while the PR stays armed is the hazard this whole block exists for.
          disarm_prior_cask_auto_merge() {
            local tap="$1"
            local pre_pr="$2"
            local branch="$3"
            local pre_state pre_node pre_version disarm_mutation out rest_rc

            pre_state="$(gh api "repos/${tap}/pulls/${pre_pr}" 2>/dev/null || true)"
            if [ -z "${pre_state}" ]; then
              echo "::error::could not read ${tap}#${pre_pr} before updating ${branch}; refusing to write with its auto-merge state unknown"
              return 1
            fi
            # THREE outcomes, not two. A `jq` that fails on a malformed
            # document prints nothing, and an empty answer compared against
            # "true" reads as "not armed" — which would proceed to the write
            # with the PR's real state unknown. Name the unreadable case and
            # fail closed on it, the same way the reset guard treats an
            # unreadable comparison. One read, so both facts describe the same
            # snapshot.
            case "$(printf '%s' "${pre_state}" \
                    | jq -r 'if .merged == true then "merged"
                             elif .auto_merge == null then "unarmed"
                             else "armed" end' 2>/dev/null || true)" in
              merged | unarmed) return 0 ;;
              armed) : ;;
              *)
                echo "::error::could not determine ${tap}#${pre_pr}'s auto-merge state before updating ${branch}; refusing to write while it may be armed"
                return 1
                ;;
            esac

            pre_node="$(printf '%s' "${pre_state}" | jq -r '.node_id // empty' 2>/dev/null || true)"
            if [ -z "${pre_node}" ]; then
              echo "::error::could not read ${tap}#${pre_pr}'s node id; refusing to write while it is armed"
              return 1
            fi
            disarm_mutation="mutation(\$id: ID!) { disablePullRequestAutoMerge(input: { pullRequestId: \$id }) { pullRequest { number } } }"
            if out="$(gh api graphql -f query="${disarm_mutation}" -F id="${pre_node}" 2>&1)"; then
              echo "disarmed auto-merge on ${tap}#${pre_pr} before updating ${branch}"
              return 0
            fi
            if ! printf '%s' "${out}" | grep -qiE 'rate limit|RATE_LIMITED'; then
              echo "::error::could not disarm auto-merge on ${tap}#${pre_pr} before updating ${branch}: ${out}"
              return 1
            fi

            # Quota. Deliver rather than abort — but only under the title the
            # armed PR already carries, so read what the branch holds NOW.
            # Unreadable means we cannot prove what would be merged, and the
            # tap squash-merges on the title: fail closed rather than ship a
            # changelog entry for a version the diff does not deliver.
            pre_version="$(cask_version_at "${branch}")"
            if [ -z "${pre_version}" ]; then
              echo "::error::the tap account's GraphQL budget is exhausted and ${branch}'s cask version could not be read; refusing to deliver ${tap}#${pre_pr} under an unverified title"
              return 1
            fi
            # CONVERGE THE TITLE FIRST. The tap squash-merges on the PR TITLE,
            # and that title was written by the run that armed this PR — it
            # describes what the branch carried THEN. An out-of-band writer
            # (serialisation stops sibling releases, not a manual edit) can
            # have moved the branch since, and `merge_cask_pr_when_green` only
            # proves the branch still carries `expected_version` — which is
            # what we just READ from it, so it agrees by construction and
            # cannot catch a title that disagrees. Without this, delivering
            # would ship the new content under the old version's changelog
            # entry: exactly the lying-title hazard the arming path re-derives
            # for. Re-read the title rather than reusing the pre-mutation
            # snapshot, so the comparison is as late as it can be.
            pre_title="chore(cask): update world-at-ruin to v${pre_version}"
            if [ "$(gh api "repos/${tap}/pulls/${pre_pr}" --jq '.title' 2>/dev/null || true)" != "${pre_title}" ]; then
              if ! gh api -X PATCH "repos/${tap}/pulls/${pre_pr}" -f title="${pre_title}" >/dev/null 2>&1; then
                echo "::error::could not retitle ${tap}#${pre_pr} to ${pre_title} before delivering it; refusing to merge it under a title that does not describe its content"
                return 1
              fi
              echo "retitled ${tap}#${pre_pr}: ${pre_title}"
            fi
            # The retitle is itself a window: prove the content the title was
            # derived from is still what the branch carries, exactly as the
            # arming loop does after its own PATCH.
            if [ "$(cask_version_at "${branch}")" != "${pre_version}" ]; then
              echo "::error::${branch} moved while retitling ${tap}#${pre_pr}; refusing to deliver it under a title derived from content it no longer carries"
              return 1
            fi
            echo "::notice::auto-merge cannot be disarmed on ${tap}#${pre_pr} — the tap account's GraphQL budget is exhausted; delivering v${pre_version} over REST instead so nothing stays armed across the write"
            rest_rc=0
            merge_cask_pr_when_green "${tap}" "${pre_pr}" "${branch}" "${pre_version}" || rest_rc=$?
            if [ "${rest_rc}" -eq 0 ]; then
              echo "delivered ${tap}#${pre_pr} instead of disarming it; nothing is armed on ${branch}"
              return 0
            fi
            # rc 2 is "the branch moved", which for the ARMING path means
            # re-derive and try again. Here it means an out-of-band writer
            # landed on the shared branch while we waited, so the armed PR's
            # title no longer describes its content — the lying-title hazard
            # itself. There is no safe recovery left before the write.
            echo "::error::could not deliver ${tap}#${pre_pr} while the GraphQL budget is exhausted; refusing to write new content while it stays armed"
            return 1
          }
          # END cask-disarm-helper

          pre_pr="$(trusted_open_pr)"
          if [ -n "${pre_pr}" ]; then
            disarm_prior_cask_auto_merge "${tap}" "${pre_pr}" "${branch}" || exit 1
          fi

          # MONOTONIC GUARD, as a COMPARE-AND-SWAP. The WORKFLOW concurrency
          # group is per TAG, so two CD runs for different releases overlap
          # freely — but THIS JOB's group is constant
          # (`homebrew-tap-cask-world-at-ruin`), so the tap handoff itself is
          # serialised across tags and two releases are never inside this step
          # at once. The compare-and-swap therefore guards the writers that
          # serialisation cannot reach: a manual edit, or any out-of-band actor
          # on this shared branch. Do not read the job's serialisation as making
          # it redundant, and do not read this guard as evidence that sibling
          # releases race here — they do not.
          #
          # Version and blob SHA must come from the SAME read: reading them
          # separately leaves a window where a newer run writes in between, so
          # this run sees the OLD version but the NEW sha and its PUT succeeds,
          # downgrading the tap. Taking both from one response makes the PUT a
          # compare-and-swap — if the branch moved, the sha is stale and GitHub
          # rejects the write, and we re-read and re-decide.
          for attempt in 1 2 3 4 5; do
            resp="$(gh api "repos/${tap}/contents/Casks/world-at-ruin.rb?ref=${branch}" 2>/dev/null || true)"
            if [ -n "${resp}" ]; then
              existing="$(printf '%s' "${resp}" | jq -r '.sha')"
              current="$(printf '%s' "${resp}" | jq -r '.content' | base64 -d \
                         | sed -n 's/^  version "\(.*\)"$/\1/p' | head -1)"
            else
              existing=""
              current=""
            fi

            if [ -n "${current}" ] && [ "${current}" != "${VERSION}" ]; then
              # SemVer precedence, NOT `sort -V`: the tag pattern accepts
              # prereleases, and `sort -V` orders 1.0.0-rc.1 ABOVE 1.0.0, so a
              # late prerelease run would downgrade a final release. Under
              # SemVer a prerelease precedes its own final release.
              core_a="${current%%-*}"; core_b="${VERSION%%-*}"
              case "${current}" in *-*) pre_a="${current#*-}";; *) pre_a="";; esac
              case "${VERSION}" in *-*) pre_b="${VERSION#*-}";; *) pre_b="";; esac
              if [ "${core_a}" != "${core_b}" ]; then
                if [ "$(printf '%s\n%s\n' "${core_a}" "${core_b}" | sort -V | tail -1)" = "${core_a}" ]; then
                  newest="${current}"; else newest="${VERSION}"; fi
              elif [ -z "${pre_a}" ]; then newest="${current}"
              elif [ -z "${pre_b}" ]; then newest="${VERSION}"
              else
                # SemVer item 11: compare dot-separated identifiers left to
                # right. Numeric identifiers compare numerically; non-numeric
                # compare ASCII; a NUMERIC identifier has LOWER precedence than
                # a non-numeric one (so alpha.1 < alpha.beta, which `sort -V`
                # gets backwards); if all shared identifiers are equal, the
                # version with MORE identifiers wins.
                newest=""
                IFS='.' read -r -a ids_a <<< "${pre_a}"
                IFS='.' read -r -a ids_b <<< "${pre_b}"
                n=$(( ${#ids_a[@]} > ${#ids_b[@]} ? ${#ids_a[@]} : ${#ids_b[@]} ))
                for ((k=0; k<n; k++)); do
                  ia="${ids_a[k]-}"; ib="${ids_b[k]-}"
                  if [ -z "${ia}" ]; then newest="${VERSION}"; break; fi
                  if [ -z "${ib}" ]; then newest="${current}"; break; fi
                  [ "${ia}" = "${ib}" ] && continue
                  if [[ "${ia}" =~ ^[0-9]+$ ]] && [[ "${ib}" =~ ^[0-9]+$ ]]; then
                    if [ "${ia}" -gt "${ib}" ]; then newest="${current}"; else newest="${VERSION}"; fi
                  elif [[ "${ia}" =~ ^[0-9]+$ ]]; then
                    newest="${VERSION}"   # numeric < non-numeric
                  elif [[ "${ib}" =~ ^[0-9]+$ ]]; then
                    newest="${current}"
                  elif [[ "${ia}" > "${ib}" ]]; then newest="${current}"
                  else newest="${VERSION}"; fi
                  break
                done
                [ -z "${newest}" ] && newest="${current}"
              fi
              if [ "${newest}" = "${current}" ]; then
                # A newer release already owns the branch content. Do NOT exit
                # the step: the PR-open/title/auto-merge block below must still
                # run — the newer run can have died between its content write
                # and its PR step, and every path must leave the PR open and
                # armed. `break` skips only the PUT.
                echo "::notice::tap already carries ${current}, which is newer than ${VERSION} — leaving its content alone"
                break
              fi
            fi

            if [ -n "${existing}" ]; then
              args=(-f "sha=${existing}")
            else
              args=()
            fi
            if gh api "repos/${tap}/contents/Casks/world-at-ruin.rb" -X PUT \
                 -f message="chore(cask): update world-at-ruin to v${VERSION}" -f content="${content}" \
                 -f branch="${branch}" "${args[@]}" >/dev/null 2>&1; then
              echo "wrote world-at-ruin ${VERSION} to ${branch}"
              break
            fi
            if [ "${attempt}" = "5" ]; then
              echo "::error::could not update the cask on ${branch} after 5 attempts — the branch kept moving under us"
              exit 1
            fi
            echo "::notice::${branch} moved while writing; re-reading and re-deciding (attempt ${attempt})"
            sleep 3
          done

          # BEGIN cask-pr-create-helper
          # Open the tap PR over REST rather than with `gh pr create`.
          #
          # `gh pr create` is backed by GraphQL, whose hourly budget belongs to
          # the ACCOUNT the tap token authenticates as and is shared with every
          # other automated consumer of that account. Exhausting it fails the
          # create for a reason that has nothing to do with this release, and
          # leaves the cask written to the branch with no PR to deliver it —
          # release undelivered, main red, and nothing retrying. REST carries a
          # separate budget, so the create survives a drained GraphQL pool.
          #
          # A concurrent creator is still benign: GitHub answers the loser with
          # "A pull request already exists", which is success for our purpose.
          # Every other failure is surfaced with the API's own message instead
          # of being swallowed, so a genuine refusal says WHY rather than
          # reaching the caller's re-check as an unexplained missing PR.
          create_cask_pr() {
            local tap="$1"
            local branch="$2"
            local cask_version="$3"
            local out
            if out="$(gh api --method POST "repos/${tap}/pulls" \
                 -f title="chore(cask): update world-at-ruin to v${cask_version}" \
                 -f head="${branch}" \
                 -f base=main \
                 -f body="Automated cask update for World at Ruin. Programmed release path: check-gated auto-merge, no review needed." 2>&1)"; then
              return 0
            fi
            if printf '%s' "${out}" | grep -qi 'already exists'; then
              echo "::notice::a cask PR for ${branch} is already open — another run opened it first"
              return 0
            fi
            echo "::error::could not open the cask PR on ${tap} for ${branch}: ${out}"
            return 1
          }
          # END cask-pr-create-helper

          # `// empty` is load-bearing: with no open PR, `jq '.[0].number'`
          # prints the literal `null`, which `grep -q .` MATCHES — so the check
          # would conclude a PR already exists and never create one, leaving the
          # job green with no tap PR at all on the very first run.
          #
          # Racy too: two runs can both see no open PR, and the create errors
          # if one already exists — failing this job over a benign overlap.
          # Tolerate the loss, then re-check so a genuine failure still errors.
          if ! trusted_open_pr | grep -q .; then
            # ALREADY DELIVERED is success, not a missing PR: a stale rerun
            # (an older tag re-run after the newer release's PR merged) finds
            # the branch content already on main and no open PR. GitHub
            # refuses a PR from a fully-merged branch ("no commits between"),
            # so without this check a valid no-op rerun would die on the
            # ensure-PR error below.
            branch_now="$(cask_version_at "${branch}")"
            main_now="$(cask_version_at main)"
            if [ -n "${branch_now}" ] && [ "${branch_now}" = "${main_now}" ]; then
              echo "::notice::${tap} main already carries v${main_now} and no cask PR is open — nothing to deliver"
              exit 0
            fi
            create_cask_pr "${tap}" "${branch}" "${VERSION}" || true
            if ! trusted_open_pr | grep -q .; then
              echo "::error::no open cask PR on ${tap} for ${branch} after attempting to create one"
              exit 1
            fi
          fi
          pr="$(trusted_open_pr)"
          echo "cask PR is open on ${tap} (#${pr}, ${branch})"

          # BEGIN cask-conflict-repair-helper
          # The branch-reset decision above reads the open-PR state ONCE,
          # before the content write, and that snapshot can go stale in a way
          # that strands the tap. While the PREVIOUS cask PR is still open the
          # reset is correctly suppressed — resetting under a live release
          # would discard it. But that PR's required checks can finish and
          # auto-merge it moments later, putting a non-ancestor squash commit
          # on main. This run then writes its cask onto a branch that has just
          # gone behind, and the PR it opens is born CONFLICTING. That PR is
          # itself open, so every later cycle's open-PR guard suppresses the
          # reset too and the tap can never recover on its own.
          #
          # Moving the check closer to the write cannot close this: reading a
          # remote state before a write is a TOCTOU, and the merge is
          # asynchronous. So REPAIR rather than predict — once the PR exists,
          # ask GitHub whether it actually conflicts.
          #
          # `mergeable_state` is computed in the background, so a freshly
          # opened PR reports `unknown` for a moment: poll rather than read
          # once, or the check misses the very PR this run just opened. A state
          # that never resolves fails CLOSED — leave the branch alone rather
          # than force-write a ref on a guess, exactly as the reset guard does.
          cask_pr_conflicts() {
            local tap="$1"
            local pr="$2"
            local state attempt
            for attempt in 1 2 3 4 5 6 7 8; do
              state="$(gh api "repos/${tap}/pulls/${pr}" --jq '.mergeable_state' 2>/dev/null || true)"
              case "${state}" in
                dirty) return 0 ;;
                '' | null | unknown) ;;
                *) return 1 ;;
              esac
              # BACK OFF, and give it a real budget. A fixed 3s × 5 is only ~12
              # seconds, and the PR being asked about is the one this run JUST
              # opened — the primary case, and the slowest, because GitHub
              # computes mergeability in the background after creation. Giving up
              # early fails CLOSED, which here means silently skipping the repair
              # in exactly the scenario it exists for, leaving the tap stuck.
              # Rising delays reach ~84s while keeping the read count bounded.
              if [ "${attempt}" != "8" ]; then
                sleep "$(( attempt * 3 ))"
              fi
            done
            return 1
          }
          # END cask-conflict-repair-helper

          if cask_pr_conflicts "${tap}" "${pr}"; then
            # Rebuild the branch's HISTORY while preserving its CONTENT: take the
            # cask as it stands, put it on top of main, and move the branch there
            # in one non-forced step. Nothing main has not received is discarded,
            # and the compare-and-swap above still owns WHICH version the content
            # names — this touches only the commits underneath it.
            #
            # PIN EVERYTHING TO ONE BRANCH REVISION. Read the branch HEAD first,
            # then read the cask and the delta AT THAT SHA, and use the same sha
            # as the rebuilt commit's parent. Reading the content from the moving
            # `${branch}` ref instead would let a writer land between the content
            # read and the head read: the parent would then be THAT writer's
            # commit while the tree carried the older cask, which is a perfectly
            # valid fast-forward — so the non-forced update would succeed and
            # silently revert their release instead of refusing. The fast-forward
            # rule only rejects moves that happen AFTER the sha it is anchored
            # to, so the capture has to be anchored to that same sha.
            repair_branch_head="$(gh api "repos/${tap}/git/ref/heads/${branch}" \
              --jq '.object.sha' 2>/dev/null || true)"
            case "${repair_branch_head}" in
              [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) : ;;
              *) repair_branch_head="" ;;
            esac
            if [ -z "${repair_branch_head}" ]; then
              echo "::error::could not read ${branch}'s head on ${tap}; refusing to rebuild it"
              exit 1
            fi
            # Content and version come from ONE read of that pinned sha, for the
            # same reason the compare-and-swap does it: reading them separately
            # lets a write land in between, so the version would describe bytes
            # that are no longer the ones being carried forward.
            repair_resp="$(gh api "repos/${tap}/contents/Casks/world-at-ruin.rb?ref=${repair_branch_head}" 2>/dev/null || true)"
            repair_content="$(printf '%s' "${repair_resp}" | jq -r '.content // empty' 2>/dev/null | tr -d '\n' || true)"
            repair_blob_captured="$(printf '%s' "${repair_resp}" | jq -r '.sha // empty' 2>/dev/null || true)"
            repair_version="$(printf '%s' "${repair_content}" | base64 -d 2>/dev/null \
              | sed -n 's/^  version "\(.*\)"$/\1/p' | head -1 || true)"
            # Read main's HEAD FIRST, then read its cask AT THAT SHA. Reading the
            # version from the `main` ref instead would let an out-of-band merge
            # land between the two, so `repair_main_version` would describe a
            # revision the branch is NOT about to be reset to — and the restore
            # loop's unknown-writer guard would then fire on main's own content,
            # aborting with the captured cask already gone from the branch.
            # Both values must come from one revision.
            #
            # Read main HERE rather than reusing base_sha: that was captured
            # before the write, and a merge in this window is the whole reason
            # the branch conflicts. Shape-check it — an empty or partial
            # response must never become the target of a force update.
            repair_sha="$(gh api "repos/${tap}/git/ref/heads/main" \
              --jq '.object.sha' 2>/dev/null || true)"
            case "${repair_sha}" in
              [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) : ;;
              *) repair_sha="" ;;
            esac
            repair_main_version=""
            if [ -n "${repair_sha}" ]; then
              repair_main_version="$(cask_version_at "${repair_sha}")"
            fi
            # ABORT on a partial read rather than rebuild from it. Every one of
            # these collapses an API, decode or parse failure into the same
            # empty string it returns for genuinely absent content, so acting on
            # empty would restore nothing over a branch whose content main has
            # not received.
            if [ -z "${repair_content}" ] || [ -z "${repair_version}" ] \
               || [ -z "${repair_blob_captured}" ] \
               || [ -z "${repair_main_version}" ] || [ -z "${repair_sha}" ]; then
              echo "::error::${tap}#${pr} conflicts with main, but the branch cask, its version or main's head could not be read; refusing to rebuild ${branch} from a partial read"
              exit 1
            fi
            # Equal versions mean the branch has nothing main lacks, so a
            # rebuild would leave the PR with an empty diff and no way to merge.
            # That is not the post-merge race this repairs — it is a tap someone
            # has edited by hand, and it needs a person, loudly.
            if [ "${repair_version}" = "${repair_main_version}" ]; then
              echo "::error::${tap}#${pr} conflicts with main while both carry v${repair_version}; refusing to rebuild ${branch}, which would leave the PR nothing to deliver"
              exit 1
            fi
            # REFUSE A DOWNGRADE. Unequal is not enough. If an out-of-band merge
            # has already put a NEWER cask on main — a manual tap edit, or a
            # `workflow_dispatch` rerun of an OLDER tag, which this workflow
            # accepts by design — then resetting onto main and restoring the
            # older captured cask opens a PR that auto-merges a Homebrew
            # DOWNGRADE. Restore only when the branch is strictly newer.
            #
            # Deliberately CONSERVATIVE rather than a second copy of the SemVer
            # comparator above: a prerelease on either side is refused instead of
            # ordered. Duplicating that comparator is how the two copies drift,
            # and a guard that is subtly wrong about precedence is worse than one
            # that declines to answer. `sort -V` is safe here only because
            # excluding prereleases leaves plain X.Y.Z on both sides — which is
            # exactly the case the comparator above documents it getting wrong.
            # Cost: a prerelease whose cask PR is born conflicting fails loudly
            # instead of self-healing. That path is rare and the failure is
            # actionable, whereas a silent downgrade is neither.
            case "${repair_version}-${repair_main_version}" in
              *-*-*)
                echo "::error::${tap}#${pr}: one of v${repair_version} / v${repair_main_version} is a prerelease; refusing to order them here — rebuild ${branch} by hand"
                exit 1
                ;;
            esac
            if [ "$(printf '%s\n%s\n' "${repair_version}" "${repair_main_version}" \
                    | sort -V | tail -1)" != "${repair_version}" ]; then
              echo "::error::${tap}#${pr} carries v${repair_version} but ${tap} main already has v${repair_main_version}; refusing to rebuild ${branch}, which would open a downgrade"
              exit 1
            fi
            # The branch's delta against main MUST be the cask and nothing else.
            # The rebuild reconstructs the branch from main's tree plus the
            # captured cask, so any OTHER branch-only path — a manual commit, a
            # bot's edit — would be silently discarded. A `dirty` mergeability
            # state says the two sides conflict; it does NOT say the cask is the
            # only difference, so ask rather than assume.
            repair_delta="$(gh api "repos/${tap}/compare/main...${repair_branch_head}" \
              --jq '[.files[].filename] | sort | join(" ")' 2>/dev/null || true)"
            if [ -z "${repair_delta}" ]; then
              echo "::error::could not read what ${branch} changes against ${tap} main; refusing to rebuild it blind"
              exit 1
            fi
            if [ "${repair_delta}" != "Casks/world-at-ruin.rb" ]; then
              echo "::error::${branch} also changes: ${repair_delta} — the rebuild reconstructs only the cask, so those would be discarded; refusing, resolve ${tap}#${pr} by hand"
              exit 1
            fi

            # REBUILD AS ONE ATOMIC, NON-FORCED REF UPDATE.
            #
            # Reset-then-restore cannot be made safe here, and guarding it is the
            # wrong shape: it is TWO mutations with an observable window between
            # them, and `force` on the ref API carries no expected-head guard (it
            # takes only the new sha), so that window is both unguardable and
            # re-opened by every retry. Build the finished state FIRST and move
            # the ref exactly once instead.
            #
            # The commit carries main's tree with the cask replaced, and parents
            # [branch, main]. Because the branch head is a parent, the update IS
            # a fast-forward — so it is issued WITHOUT `force`, and GitHub then
            # refuses it unless the branch is still exactly where it was read.
            # That is precisely the compare-and-swap the ref API does not
            # otherwise offer.
            #
            # Everything downstream of the old two-step is gone with it: there is
            # no intermediate state to observe (so no stale-read ambiguity), no
            # cask to restore afterwards (so no create-vs-update ambiguity), and
            # nothing to verify after the write — the ref either moved to the
            # finished commit or did not move at all.
            repair_main_tree="$(gh api "repos/${tap}/git/commits/${repair_sha}" \
              --jq '.tree.sha' 2>/dev/null || true)"
            if [ -z "${repair_main_tree}" ]; then
              echo "::error::could not read ${tap} main's tree; refusing to rebuild ${branch}"
              exit 1
            fi
            repair_tree="$(jq -nc --arg base "${repair_main_tree}" --arg blob "${repair_blob_captured}" \
              '{base_tree:$base,tree:[{path:"Casks/world-at-ruin.rb",mode:"100644",type:"blob",sha:$blob}]}' \
              | gh api "repos/${tap}/git/trees" -X POST --input - --jq '.sha' 2>/dev/null || true)"
            if [ -z "${repair_tree}" ]; then
              echo "::error::could not build the rebuilt tree for ${branch}; refusing to move the ref"
              exit 1
            fi
            repair_commit="$(jq -nc \
              --arg msg "chore(cask): update world-at-ruin to v${repair_version}" \
              --arg tree "${repair_tree}" --arg parent "${repair_branch_head}" --arg base "${repair_sha}" \
              '{message:$msg,tree:$tree,parents:[$parent,$base]}' \
              | gh api "repos/${tap}/git/commits" -X POST --input - --jq '.sha' 2>/dev/null || true)"
            if [ -z "${repair_commit}" ]; then
              echo "::error::could not create the rebuilt commit for ${branch}; refusing to move the ref"
              exit 1
            fi
            # NO `force` — that omission is the entire safety property, not a
            # detail. Retrying is harmless precisely because of it: a retry can
            # only ever re-apply the same fast-forward, never overwrite a branch
            # that has moved.
            repair_moved=""
            for attempt in 1 2 3; do
              if gh api "repos/${tap}/git/refs/heads/${branch}" -X PATCH \
                   -f sha="${repair_commit}" >/dev/null 2>&1; then
                repair_moved=1
                break
              fi
              if [ "${attempt}" != "3" ]; then
                sleep 3
              fi
            done
            if [ -z "${repair_moved}" ]; then
              echo "::error::could not fast-forward ${branch} onto ${tap} main; it moved while the rebuild was being prepared, so completing would have discarded a write this run did not capture — refusing, ${tap}#${pr} stays conflicting"
              exit 1
            fi
            # No re-check of mergeability follows, deliberately: the branch now
            # descends from main and differs only in the cask, so it cannot
            # conflict by construction. If main moved again in the meantime the
            # branch is merely behind once more, and the next release repairs it
            # — which is the difference between a transient conflict and the
            # permanent one this closes.
            echo "::notice::${tap}#${pr} was born conflicting — rebuilt ${branch} onto main (${repair_sha}) carrying the v${repair_version} cask"
          fi

          # Title convergence + arming. The title must state the version the
          # branch CONTENT actually carries, never this run's ${VERSION}: a
          # concurrent newer release can win the compare-and-swap above (or
          # this run is the stale one that skipped its write), and the tap
          # squash-merges on the PR title — a stale title ships a changelog
          # entry for a version the diff does not deliver (live case:
          # tap#1213 titled 0.16.0 while its branch carried 0.21.0). The
          # version is re-derived INSIDE the loop and re-verified after the
          # retitle: without that, a stale run's PATCH could be the LAST
          # title write after a newer run already armed auto-merge — the
          # lying-title merge this exists to prevent. When the re-read shows
          # the branch moved, loop and re-derive.
          #
          # Arm auto-merge so the PR merges the moment the tap's required
          # checks (audit + style + script tests) pass — no agent or human in
          # the loop (maintainer direction 2026-07-18; #169). This is the same
          # check-gated flow the tap already runs for dependency bots; the org
          # enable-auto-merge workflow cannot arm these PRs because its
          # eligibility keys on allowlisted BOT authors and this PR is
          # authored by the tap token. Arming is deliberately not head-bound:
          # the content is monotonic (compare-and-swap above), auto-merge
          # survives follow-up pushes, and the checks always gate the final
          # head. Failures are LOUD — a cask PR that silently never merges is
          # exactly how the tap fell six releases behind (#169).
          armed=false
          for attempt in 1 2 3 4 5; do
            branch_version="$(cask_version_at "${branch}")"
            if [ -z "${branch_version}" ]; then
              echo "::error::could not read the cask version back from ${branch}"
              exit 1
            fi
            title="chore(cask): update world-at-ruin to v${branch_version}"
            pr_state="$(gh api "repos/${tap}/pulls/${pr}")"
            if [ "$(printf '%s' "${pr_state}" | jq -r '.title')" != "${title}" ]; then
              gh api -X PATCH "repos/${tap}/pulls/${pr}" -f title="${title}" >/dev/null
              echo "retitled ${tap}#${pr}: ${title}"
            fi
            # Verify the content the title was derived from is still current;
            # a moved branch means a newer run is writing — re-derive rather
            # than leave its title stale-overwritten.
            if [ "$(cask_version_at "${branch}")" != "${branch_version}" ]; then
              echo "::notice::${branch} moved during retitle; re-deriving (attempt ${attempt})"
              sleep 2
              continue
            fi
            if [ "$(printf '%s' "${pr_state}" | jq -r '.merged')" = "true" ]; then
              echo "${tap}#${pr} already merged"
              armed=true
              break
            fi
            if [ "$(printf '%s' "${pr_state}" | jq -r '.auto_merge != null')" = "true" ]; then
              echo "auto-merge already armed on ${tap}#${pr}"
              armed=true
              break
            fi
            pr_node="$(printf '%s' "${pr_state}" | jq -r '.node_id')"
            # `\$id` is escaped so the shell leaves it literal: it is a
            # GraphQL variable, not a shell one. GraphQL directly (not
            # `gh pr merge --auto`): the gh subcommand resolves the viewer's
            # `login`, a scope the tap token lacks — the same trap that
            # stranded ksail's cask PRs as drafts (ksail#6134).
            mutation="mutation(\$id: ID!) { enablePullRequestAutoMerge(input: { pullRequestId: \$id, mergeMethod: SQUASH }) { pullRequest { number } } }"
            if out="$(gh api graphql -f query="${mutation}" -F id="${pr_node}" 2>&1)"; then
              echo "auto-merge armed on ${tap}#${pr}"
            elif printf '%s' "${out}" | grep -qi 'clean status'; then
              # Every required check is already green, so GitHub refuses to
              # arm (nothing left to wait for) — merge directly instead,
              # BOUND to the head this iteration read (`sha` is the REST
              # merge endpoint's head-must-match guard): without it, a newer
              # head pushed after the clean-status result would merge before
              # its checks run — the tap token can bypass rulesets, so the
              # endpoint would not stop it. A moved head is refused and
              # re-enters the loop.
              if gh api -X PUT "repos/${tap}/pulls/${pr}/merge" \
                   -f merge_method=squash \
                   -f sha="$(printf '%s' "${pr_state}" | jq -r '.head.sha')" >/dev/null 2>&1; then
                echo "checks were already green — merged ${tap}#${pr} directly"
                armed=true
                break
              fi
              sleep 2
              continue
            elif printf '%s' "${out}" | grep -qi 'already.*enabled'; then
              echo "auto-merge already armed on ${tap}#${pr}"
            elif printf '%s' "${out}" | grep -qiE 'rate limit|RATE_LIMITED'; then
              # The account's GraphQL budget is exhausted. That is a property
              # of unrelated consumption on a shared account, not of this
              # release, and the budget resets hourly — well beyond this job's
              # timeout, so retrying the mutation cannot succeed. Do
              # auto-merge's waiting over REST instead, which carries its own
              # budget. The title is already converged at this point, so the
              # squash lands under the same message arming would have used.
              echo "::notice::auto-merge cannot be armed on ${tap}#${pr} — the tap account's GraphQL budget is exhausted; delivering over REST instead"
              # `|| rest_rc=$?` rather than a bare call: under `set -e` a
              # non-zero return would abort the step before rc 2 could be read
              # as "re-derive" rather than "failed".
              rest_rc=0
              merge_cask_pr_when_green "${tap}" "${pr}" "${branch}" "${branch_version}" || rest_rc=$?
              if [ "${rest_rc}" -eq 0 ]; then
                armed=true
                break
              fi
              if [ "${rest_rc}" -eq 2 ]; then
                # Same fall-through the arming path takes when the branch moves:
                # loop, re-derive the title from the new content, and deliver
                # under a title that describes what is actually being merged.
                sleep 2
                continue
              fi
              exit 1
            else
              echo "::error::could not arm auto-merge on ${tap}#${pr}: ${out}"
              exit 1
            fi
            # Armed — but the mutation is not content-bound: a newer run can
            # push between this iteration's verify and the arming, so the arm
            # now covers content the verified title was NOT derived from. If
            # that newer run dies before its own retitle (exactly the crash
            # window the fall-through above exists for), checks eventually
            # pass and auto-merge ships the stale title. Re-read; when the
            # branch moved, loop — the next iteration re-derives the title
            # and exits through the already-armed path.
            if [ "$(cask_version_at "${branch}")" = "${branch_version}" ]; then
              armed=true
              break
            fi
            echo "::notice::${branch} moved while arming; re-deriving the title (attempt ${attempt})"
            sleep 2
          done
          if [ "${armed}" != "true" ]; then
            echo "::error::could not arm auto-merge or merge ${tap}#${pr} after 5 attempts"
            exit 1
          fi

  cd-required-checks:
    name: CD - Required Checks
    runs-on: ubuntu-latest
    needs:
      [
        publish-macos,
        attach-release,
        publish-ghcr,
        verify-ghcr-public,
        publish-release,
        homebrew-cask,
      ]
    if: ${{ always() }}
    steps:
      - uses: devantler-tech/actions/aggregate-job-checks@625b7c0cd5ad4a04f9eb7494298c6d0fa44521ef # v11.0.4
        with:
          job-results: >-
            ${{ needs.publish-macos.result }}
            ${{ needs.attach-release.result }}
            ${{ needs.publish-ghcr.result }}
            ${{ needs.verify-ghcr-public.result }}
            ${{ needs.publish-release.result }}
            ${{ needs.homebrew-cask.result }}
          check-name: "CD - Required Checks"
