name: Capture exported base
description: Run the complete owner-local native exported base recipe
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Install Godot and templates for the exported base comparison
      id: base-engine
      timeout-minutes: 2
      continue-on-error: true
      run: |
        started="$(date +%s)"
        curl -fsSL -o godot-base.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
        echo "${GODOT_MACOS_SHA512}  godot-base.zip" | shasum -a 512 -c -
        unzip -q godot-base.zip
        printf '#!/bin/sh\nexec "%s/Godot.app/Contents/MacOS/Godot" "$@"\n' "${PWD}" | sudo tee /usr/local/bin/godot >/dev/null
        sudo chmod +x /usr/local/bin/godot
        curl -fsSL -o base-templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
        echo "${GODOT_TEMPLATES_SHA512}  base-templates.tpz" | shasum -a 512 -c -
        unzip -q base-templates.tpz
        mkdir -p "${HOME}/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
        mv templates/* "${HOME}/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable/"
        elapsed=$(( $(date +%s) - started ))
        echo "ADDED CI COST: base Godot and templates install ${elapsed}s"
        {
          echo "### Exported-client comparison setup"
          echo
          echo "Pinned Godot and templates install: **${elapsed}s**."
        } >> "$GITHUB_STEP_SUMMARY"
      shell: bash
    - name: Render the PR base through the exported client
      id: base-capture
      if: steps.base-engine.outcome == 'success'
      timeout-minutes: 9
      continue-on-error: true
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        tools/exported-frame-change-report.sh render-base \
          "$BASE_SHA" "${RUNNER_TEMP}/exported-frame-report"
      shell: bash
    - name: Bind the advisory result to this source and attempt
      timeout-minutes: 1
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        ENGINE_OUTCOME: ${{ steps.base-engine.outcome }}
        CAPTURE_OUTCOME: ${{ steps.base-capture.outcome }}
      run: |
        tools/exported-frame-change-report.sh record-source \
          "${RUNNER_TEMP}/exported-frame-report" "$ENGINE_OUTCOME" "$CAPTURE_OUTCOME"
      shell: bash
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      timeout-minutes: 1
      with:
        name: exported-base-${{ github.sha }}-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/exported-frame-report/source.json
          ${{ runner.temp }}/exported-frame-report/*.log
          ${{ runner.temp }}/exported-frame-report/exported-shots-base/*.png
          ${{ runner.temp }}/exported-frame-report/exported-shots-base/*.txt
        if-no-files-found: error
    - id: recorded
      shell: bash
      run: echo "recorded=true" >> "$GITHUB_OUTPUT"
outputs:
  recorded:
    description: The complete BASE outcome and evidence were uploaded
    value: ${{ steps.recorded.outputs.recorded }}
