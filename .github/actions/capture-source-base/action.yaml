name: Capture source base
description: Run the complete owner-local native source base recipe
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      timeout-minutes: 1
      with:
        go-version-file: server/go.mod
        cache: false
    - id: install
      name: Install Godot (pinned, checksum-verified)
      timeout-minutes: 2
      continue-on-error: true
      run: bash tools/install-ci-macos-godot.sh
      shell: bash
    - id: base
      name: Render the merge base for comparison
      if: steps.install.outcome == 'success'
      timeout-minutes: 8
      continue-on-error: true
      run: bash tools/render-source-base.sh
      shell: bash
    - name: Seal the known BASE outcome
      timeout-minutes: 1
      env:
        INSTALL_RESULT: ${{ steps.install.outcome }}
        RENDER_RESULT: ${{ steps.base.outcome }}
      run: bash tools/source-evidence-package.sh base
      shell: bash
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      timeout-minutes: 1
      with:
        name: source-base-${{ github.sha }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/source-base/
        if-no-files-found: error
