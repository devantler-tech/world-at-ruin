name: Capture source head
description: Run the complete owner-local native source head recipe
inputs:
  group:
    description: "Complete source evidence group: world or activity"
    required: true
  first-run:
    description: Closed first-run selection
    required: true
  gpu-gated:
    description: Closed GPU-evidence selection
    required: true
  visual:
    description: Closed visual-evidence selection
    required: true
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: server/go.mod
        cache: false
    - env:
        CAPTURE_GROUP: ${{ inputs.group }}
        FIRST_RUN: ${{ inputs.first-run }}
        GPU_GATED: ${{ inputs.gpu-gated }}
        VISUAL: ${{ inputs.visual }}
      name: Validate source capture inputs
      run: bash tools/source-capture-inputs.sh
      shell: bash
    - name: Install Godot (pinned, checksum-verified)
      run: bash tools/install-ci-macos-godot.sh
      shell: bash
    - name: Headless import + class-name scan
      run: godot --headless --editor --quit --path client 2>&1 | tee import.log
      shell: bash
    - if: inputs.group == 'world'
      name: Capture frames
      run: |
        set -o pipefail
        mkdir -p "${RUNNER_TEMP}/shots"
        # Seed a save so the first-run creator does not cover a third of every
        # frame. Checked explicitly rather than trusting the shell's errexit:
        # if this preset is ever renamed, a silent miss here would produce
        # frames of the character creator that still passed every guard.
        if ! cp client/recipes/wanderer.json "${RUNNER_TEMP}/probe_save.json"; then
          echo "::error::could not seed the capture save from client/recipes/wanderer.json — frames would show the first-run creator instead of the world"
          exit 1
        fi
        # No --resolution override: the gate treats client/project.godot as a
        # visual trigger precisely BECAUSE it carries the shipped window size,
        # so forcing a size here would hide the very change being reviewed.
        # The runner clamps the window to what its display allows regardless.
        WAR_SHOT_DIR="${RUNNER_TEMP}/shots" \
        WAR_SAVE_PATH="${RUNNER_TEMP}/probe_save.json" \
        WAR_VAULT_PATH="${RUNNER_TEMP}/probe_save_vault.json" \
        WAR_BOOT_RECOVERY_PATH="${RUNNER_TEMP}/probe_save_recovery.json" \
          godot --path client res://tools/frame_capture.tscn 2>&1 | tee capture.log
        if ! grep -q "CAPTURE PASS" capture.log; then
          echo "::error::frame capture did not report PASS — see log"; tail -40 capture.log; exit 1
        fi
        # The project's own positive boot marker must also be present. The
        # capture tool asserts the world exists and is visible, but a path
        # that returns early AFTER the terrain is built and BEFORE main.gd
        # finishes booting would still satisfy that — and the frames would
        # depict a half-initialised game.
        if ! grep -q "BOOT_OK" capture.log; then
          echo "::error::capture never reached BOOT_OK — frames depict a partially booted game"
          tail -40 capture.log; exit 1
        fi
        # A runtime failure AFTER the world builds can still leave a
        # renderable scene, so PASS alone is not proof the frames depict a
        # healthy game. Treat script errors during capture as a failure.
        #
        # EXCEPT the Metal driver's `timeout waiting for fence`: the runner's
        # GPU is a virtualised Apple Paravirtual adapter that intermittently
        # misses a fence during warm-up and then RECOVERS. It is a driver
        # retry, not a render fault — proven by the frames that follow it
        # being byte-for-byte identical to runs without it (same luma spreads
        # to three decimals). Failing on it rejected three healthy captures.
        # Filter to a FILE rather than piping into `grep -q`. Under pipefail a
        # `grep -v … | grep -q …` test can report the pipeline as failed when
        # the downstream grep exits early on a match and the upstream takes
        # SIGPIPE — which would read as "no errors found" and let a genuine
        # SCRIPT ERROR through. (Not reproducible on this macOS runner even
        # over a 1.7 MB log, but the file form removes the hazard class
        # entirely and costs nothing.)
        grep -vE "timeout waiting for fence|drivers/metal/rendering_device_driver_metal" \
          capture.log > capture.filtered.log || true
        if grep -qE "SCRIPT ERROR|^ERROR" capture.filtered.log; then
          echo "::error::errors during capture — frames may not depict a healthy world"
          grep -nE "SCRIPT ERROR|^ERROR" capture.filtered.log | head -20
          exit 1
        fi
      shell: bash
    - if: inputs.group == 'activity'
      name: Capture the moving-key material response
      run: |
        set -o pipefail
        mkdir -p "${RUNNER_TEMP}/shots/light-response"
        cp client/recipes/wanderer.json "${RUNNER_TEMP}/light_response_save.json"
        WAR_SCENARIO=light_response \
        WAR_SHOT_DIR="${RUNNER_TEMP}/shots/light-response" \
        WAR_SAVE_PATH="${RUNNER_TEMP}/light_response_save.json" \
        WAR_VAULT_PATH="${RUNNER_TEMP}/light_response_vault.json" \
        WAR_BOOT_RECOVERY_PATH="${RUNNER_TEMP}/light_response_recovery.json" \
          godot --path client res://tools/frame_capture.tscn 2>&1 | tee capture-light-response.log
        if ! grep -q "CAPTURE PASS" capture-light-response.log; then
          echo "::error::moving-key capture did not report PASS — the dynamic response evidence is missing"
          tail -40 capture-light-response.log; exit 1
        fi
        if ! grep -q "BOOT_OK" capture-light-response.log; then
          echo "::error::moving-key capture never reached BOOT_OK"
          tail -40 capture-light-response.log; exit 1
        fi
        grep -vE "timeout waiting for fence|drivers/metal/rendering_device_driver_metal" \
          capture-light-response.log > capture-light-response.filtered.log || true
        if grep -qE "SCRIPT ERROR|^ERROR" capture-light-response.filtered.log; then
          echo "::error::errors during moving-key capture — response frames may depict a degraded world"
          grep -nE "SCRIPT ERROR|^ERROR" capture-light-response.filtered.log | head -20
          exit 1
        fi
      shell: bash
    - if: inputs.group == 'activity'
      name: Capture the replicated population
      run: |
        set -o pipefail
        mkdir -p "${RUNNER_TEMP}/shots/replication"
        if ! cp client/recipes/wanderer.json "${RUNNER_TEMP}/replication_save.json"; then
          echo "::error::could not seed the replication-capture save from client/recipes/wanderer.json — frames would show the first-run creator instead of the population"
          exit 1
        fi
        WAR_SCENARIO=replication \
        WAR_SHOT_DIR="${RUNNER_TEMP}/shots/replication" \
        WAR_SAVE_PATH="${RUNNER_TEMP}/replication_save.json" \
        WAR_VAULT_PATH="${RUNNER_TEMP}/replication_save_vault.json" \
        WAR_BOOT_RECOVERY_PATH="${RUNNER_TEMP}/replication_save_recovery.json" \
          godot --path client res://tools/frame_capture.tscn 2>&1 | tee capture-replication.log
        # Require the population marker, not a bare PASS: the world scenario
        # prints "CAPTURE PASS" too, so a regression that silently fell back
        # to the default path would satisfy a plain grep while the world PNGs
        # already in this artifact satisfied the frames-exist check.
        if ! grep -qE "[0-9]+ replicated entities written" capture-replication.log; then
          echo "::error::replication capture did not report a population — see log"; tail -40 capture-replication.log; exit 1
        fi
        if ! grep -q "BOOT_OK" capture-replication.log; then
          echo "::error::replication capture never reached BOOT_OK — frames depict a partially booted game"
          tail -40 capture-replication.log; exit 1
        fi
        # A script error anywhere else in the run leaves the population marker
        # and BOOT_OK looking healthy while the world around the capsules is
        # degraded — the same green-check-over-degraded-evidence failure the
        # world and moving-key steps already sweep for. The carve-out is the
        # known Metal fence-timeout noise, not a general softening.
        grep -vE "timeout waiting for fence|drivers/metal/rendering_device_driver_metal" \
          capture-replication.log > capture-replication.filtered.log || true
        if grep -qE "SCRIPT ERROR|^ERROR" capture-replication.filtered.log; then
          echo "::error::errors during the replication capture — the frames may not depict a healthy world"
          grep -nE "SCRIPT ERROR|^ERROR" capture-replication.filtered.log | head -20
          exit 1
        fi
        if grep -qE "SHADER ERROR|Shader compilation failed" capture-replication.log; then
          echo "::error::shader compilation failed during the replication capture — the frames show a fallback material"
          grep -nE "SHADER ERROR|Shader compilation failed" capture-replication.log | head -20
          exit 1
        fi
      shell: bash
    - if: inputs.group == 'activity'
      name: Capture the authoritative mob chase
      run: |
        set -o pipefail
        mkdir -p "${RUNNER_TEMP}/shots/mob-chase"
        if ! cp client/recipes/wanderer.json "${RUNNER_TEMP}/mob_chase_save.json"; then
          echo "::error::could not seed the mob-chase capture save"
          exit 1
        fi
        WAR_SCENARIO=mob_chase \
        WAR_SHOT_DIR="${RUNNER_TEMP}/shots/mob-chase" \
        WAR_SAVE_PATH="${RUNNER_TEMP}/mob_chase_save.json" \
        WAR_VAULT_PATH="${RUNNER_TEMP}/mob_chase_vault.json" \
        WAR_BOOT_RECOVERY_PATH="${RUNNER_TEMP}/mob_chase_recovery.json" \
          godot --path client res://tools/frame_capture.tscn 2>&1 | tee capture-mob-chase.log
        if ! grep -q "^MOB CHASE on " capture-mob-chase.log; then
          echo "::error::mob-chase capture did not report an authoritative moving sequence"
          tail -40 capture-mob-chase.log
          exit 1
        fi
        if ! grep -q "BOOT_OK" capture-mob-chase.log; then
          echo "::error::mob-chase capture never reached BOOT_OK"
          tail -40 capture-mob-chase.log
          exit 1
        fi
        grep -vE "timeout waiting for fence|drivers/metal/rendering_device_driver_metal" \
          capture-mob-chase.log > capture-mob-chase.filtered.log || true
        if grep -qE "SCRIPT ERROR|^ERROR" capture-mob-chase.filtered.log; then
          echo "::error::errors during mob-chase capture — the sequence may depict a degraded world"
          grep -nE "SCRIPT ERROR|^ERROR" capture-mob-chase.filtered.log | head -20
          exit 1
        fi
      shell: bash
    - if: inputs.group == 'world'
      name: Capture the opted-in ground previews
      run: |
        set -o pipefail
        mkdir -p "${RUNNER_TEMP}/shots/opt-in-previews"
        # Seed this capture's OWN save, as every other scenario step does.
        # Borrowing the world capture's `probe_save.json` made these frames
        # depend on a previous step's leftovers: if that step is ever
        # reordered, renamed or made conditional, the save is absent, the
        # first-run creator covers a third of every "preview" frame, and
        # CAPTURE PASS, BOOT_OK and the error sweep all still pass. Checked
        # explicitly rather than trusting errexit, for the reason the world
        # capture gives — a silent miss here publishes frames of the creator
        # that satisfy every guard.
        if ! cp client/recipes/wanderer.json "${RUNNER_TEMP}/preview_save.json"; then
          echo "::error::could not seed the opt-in preview save from client/recipes/wanderer.json — frames would show the first-run creator instead of the treatment"
          exit 1
        fi
        flags_file="${RUNNER_TEMP}/shots/opt-in-previews/enabled-flags.txt"
        tools/preview-flags.sh --env >"$flags_file"
        echo "opt-in treatments enabled for this capture:"
        cat "$flags_file"
        set -a
        # shellcheck source=/dev/null
        . "$flags_file"
        set +a
        WAR_SHOT_DIR="${RUNNER_TEMP}/shots/opt-in-previews" \
        WAR_SAVE_PATH="${RUNNER_TEMP}/preview_save.json" \
        WAR_VAULT_PATH="${RUNNER_TEMP}/preview_save_vault.json" \
        WAR_BOOT_RECOVERY_PATH="${RUNNER_TEMP}/preview_save_recovery.json" \
          godot --path client res://tools/frame_capture.tscn 2>&1 | tee capture-previews.log
        if ! grep -q "CAPTURE PASS" capture-previews.log; then
          echo "::error::opted-in preview capture did not report PASS — the enabled treatments would have no frame evidence"
          tail -40 capture-previews.log; exit 1
        fi
        if ! grep -q "BOOT_OK" capture-previews.log; then
          echo "::error::opted-in preview capture never reached BOOT_OK"
          tail -40 capture-previews.log; exit 1
        fi
        # Same error rejection as the default capture above: an error that
        # only occurs on the opted-in path can still leave a renderable scene
        # that prints PASS and BOOT_OK, so publishing a degraded preview frame
        # and reporting success is exactly the failure this evidence exists
        # to prevent. Same Metal fence carve-out and same file form (not a
        # pipe) for the reasons given there.
        grep -vE "timeout waiting for fence|drivers/metal/rendering_device_driver_metal" \
          capture-previews.log > capture-previews.filtered.log || true
        if grep -qE "SCRIPT ERROR|^ERROR" capture-previews.filtered.log; then
          echo "::error::errors during the opted-in preview capture — its frames may not depict a healthy world"
          grep -nE "SCRIPT ERROR|^ERROR" capture-previews.filtered.log | head -20
          exit 1
        fi
      shell: bash
    - if: inputs.group == 'world' && inputs.first-run == 'true'
      name: Capture the first-run UI
      run: |
        set -o pipefail
        # The save must be ABSENT here — its absence is precisely what makes
        # the creator open. Point at a path inside the run's temp dir that was
        # never created; the tool fails closed if the creator does not appear,
        # so a stray save cannot silently turn this back into a world shot.
        # Exercise the opted-in preview this PR actually changes. The base is
        # still write-capability 1, so the same value cannot bypass its gate.
        WAR_SHOT_DIR="${RUNNER_TEMP}/shots" \
        WAR_SCENARIO=first_run \
        WAR_LAYERED_OUTFIT_PICKERS=1 \
        WAR_SAVE_PATH="${RUNNER_TEMP}/no_such_save.json" \
        WAR_VAULT_PATH="${RUNNER_TEMP}/no_such_save_vault.json" \
        WAR_BOOT_RECOVERY_PATH="${RUNNER_TEMP}/no_such_save_recovery.json" \
          godot --path client res://tools/frame_capture.tscn 2>&1 | tee first-run.log
        # Require the FIRST-RUN marker, not a bare PASS: the world scenario
        # prints "CAPTURE PASS" too, so a regression that silently dropped
        # back to the default path would satisfy a plain PASS grep — and the
        # `Frames actually exist` check downstream is already satisfied by the
        # world PNGs sitting in the same directory. Since tools/ changes are
        # gated in here precisely so the tool validates itself, that hole
        # would let the tool stop working and still go green.
        if ! grep -qE "[0-9]+ first-run vantages? written" first-run.log; then
          echo "::error::first-run capture did not report a first-run vantage — see log"; tail -40 first-run.log; exit 1
        fi
        if ! grep -Fxq "BACKDROP PINNED — scenery clocks fixed before first-run capture" first-run.log; then
          echo "::error::first-run capture did not pin its live scenery clock before boot"
          tail -40 first-run.log; exit 1
        fi
        # Require the FULL expected set, not merely a plausible count. A
        # capture-tool change that dropped the lower-panel shot or the preset
        # loop would still report some number and still write first_run.png —
        # and since tools/ is gated in here precisely so tool changes validate
        # themselves, accepting any count would let the tool quietly stop
        # photographing most of what the gate fires on.
        #
        # The preset list is read from the creator itself rather than repeated
        # here, so adding a preset cannot leave CI silently checking the old
        # set. Fail loudly if it cannot be parsed: an empty list would turn
        # this whole check into a no-op.
        presets=$(grep -oE 'const PRESETS := \[[^]]*\]' client/scripts/character_creator.gd \
          | grep -oE '"[a-z_]+"' | tr -d '"')
        if [ -z "$presets" ]; then
          echo "::error::could not read PRESETS from client/scripts/character_creator.gd — cannot tell which frames to require"
          exit 1
        fi
        expected="first_run first_run_outfit first_run_torso_clothing first_run_legs_clothing first_run_feet_clothing first_run_feet_armor first_run_head_clothing first_run_head_armor first_run_hands_armor first_run_lower"
        for p in $presets; do expected="$expected first_run_$p"; done
        missing=""
        for f in $expected; do
          [ -s "${RUNNER_TEMP}/shots/$f.png" ] || missing="$missing $f.png"
        done
        if [ -n "$missing" ]; then
          echo "::error::first-run frames missing:$missing"
          ls -la "${RUNNER_TEMP}/shots" || true
          exit 1
        fi
        echo "first-run frames present:$expected"
        # Same reasoning as the seeded capture: the tool proves the creator is
        # up, but a path returning early before main.gd finishes booting would
        # still satisfy that, and the frame would depict a half-started game.
        # This run exercises the ABSENT-save branch, which the seeded capture
        # never touches, so it needs its own boot proof.
        if ! grep -q "BOOT_OK" first-run.log; then
          echo "::error::first-run capture never reached BOOT_OK — the frame depicts a partially booted game"
          tail -40 first-run.log; exit 1
        fi
        grep -vE "timeout waiting for fence|drivers/metal/rendering_device_driver_metal" \
          first-run.log > first-run.filtered.log || true
        if grep -qE "SCRIPT ERROR|^ERROR" first-run.filtered.log; then
          echo "::error::errors during the first-run capture"
          grep -nE "SCRIPT ERROR|^ERROR" first-run.filtered.log | head -20
          exit 1
        fi
        # The breath pin is what makes these frames REPEAT (#485). Assert it
        # fired for every frame, because deleting the call passes every unit
        # test in the repo: the frames still render, still write and still
        # report CAPTURE PASS, while the change report silently returns to
        # reporting tens of percent on builds that changed nothing. Measured
        # on unchanged main, two runs of identical code: first_run_elder
        # 53.74% of pixels changed, first_run_villager 46.63%; pinned, the
        # same pass reads 0.47% and 0.01%.
        #
        # Counted off the FILTERED log for the same reason the error scan is,
        # and compared against the CAPTURED lines rather than a hard-coded
        # number so adding a first-run frame cannot leave this checking a
        # stale count. `|| true` because grep -c exits 1 on no match, which
        # this step's `set -o pipefail` would otherwise turn into a silent
        # abort before the comparison runs.
        shot_lines=$(grep -cE "^CAPTURED first_run" first-run.filtered.log || true)
        pin_lines=$(grep -cE "^PINNED first_run" first-run.filtered.log || true)
        if [ "$shot_lines" -eq 0 ] || [ "$pin_lines" -ne "$shot_lines" ]; then
          echo "::error::first-run capture pinned $pin_lines of $shot_lines frames — an unpinned frame is photographed mid-breath and does not repeat between runs"
          grep -nE "^(CAPTURED|PINNED) first_run" first-run.filtered.log | head -30
          exit 1
        fi
        echo "breath pinned on all $pin_lines first-run frames"
      shell: bash
    - if: inputs.group == 'activity' && inputs.visual == 'true'
      name: Capture the breathing idle
      run: |
        set -o pipefail
        # Seed a save, exactly as the world capture does — with NO save the
        # first-run creator opens and its panel covers a third of the frame.
        # This was not a hypothetical: the first version of this step merely
        # pointed WAR_SAVE_PATH at a path it never created, and the captured
        # evidence came back with the creator over the subject while every
        # check still passed.
        if ! cp client/recipes/wanderer.json "${RUNNER_TEMP}/breath_save.json"; then
          echo "::error::could not seed the breath-capture save from client/recipes/wanderer.json — frames would show the first-run creator over the subject"
          exit 1
        fi
        # Into a subdirectory, for exactly the reason `walk` and `replication`
        # already are: this is a MOTION sequence, and the base render below
        # covers the world and first-run scenarios only. Left at the top level
        # its six phases were compared against a base that is never rendered,
        # so every visual PR reported `unmatched 6` — 25 frames claimed, 19
        # comparable, forever. That is not a measurable gap, it is a category
        # error: a breath phase has no static base vantage to compare with,
        # and the idle's own regression test is the frames-must-differ guard
        # below, not a base diff.
        mkdir -p "${RUNNER_TEMP}/shots/breath"
        WAR_SHOT_DIR="${RUNNER_TEMP}/shots/breath" \
        WAR_SCENARIO=breath \
        WAR_SAVE_PATH="${RUNNER_TEMP}/breath_save.json" \
        WAR_VAULT_PATH="${RUNNER_TEMP}/breath_save_vault.json" \
        WAR_BOOT_RECOVERY_PATH="${RUNNER_TEMP}/breath_save_recovery.json" \
          godot --path client res://tools/frame_capture.tscn 2>&1 | tee breath.log
        # Require the BREATH marker, not a bare PASS: the world scenario
        # prints "CAPTURE PASS" too, so a regression that silently fell back
        # to the default path would satisfy a plain grep while the world PNGs
        # already in this directory satisfied the downstream frames-exist
        # check.
        if ! grep -qE "[0-9]+ breath phases written" breath.log; then
          echo "::error::breath capture did not report a phase sequence — see log"; tail -40 breath.log; exit 1
        fi
        # A broken shader still prints CAPTURE PASS and still writes files
        # (#231), so compilation failures are checked separately from the
        # tool's own verdict.
        if grep -qE "SHADER ERROR|Shader compilation failed" breath.log; then
          echo "::error::shader compilation failed during the breath capture — the frames show a fallback material"
          grep -nE "SHADER ERROR|Shader compilation failed" breath.log | head -20
          exit 1
        fi
      shell: bash
    - if: inputs.group == 'activity'
      name: Capture the opt-in grounded walk
      run: |
        set -o pipefail
        mkdir -p "${RUNNER_TEMP}/shots/walk"
        if ! cp client/recipes/wanderer.json "${RUNNER_TEMP}/walk_save.json"; then
          echo "::error::could not seed the walk-capture save from client/recipes/wanderer.json"
          exit 1
        fi
        WAR_SCENARIO=walk \
        WAR_WALK_CYCLE=1 \
        WAR_SHOT_DIR="${RUNNER_TEMP}/shots/walk" \
        WAR_SAVE_PATH="${RUNNER_TEMP}/walk_save.json" \
        WAR_VAULT_PATH="${RUNNER_TEMP}/walk_save_vault.json" \
        WAR_BOOT_RECOVERY_PATH="${RUNNER_TEMP}/walk_save_recovery.json" \
          godot --path client res://tools/frame_capture.tscn 2>&1 | tee walk.log
        if ! grep -qE "[0-9]+ walk phases written" walk.log; then
          echo "::error::walk capture did not report a phase sequence — see log"; tail -40 walk.log; exit 1
        fi
        if grep -qE "SHADER ERROR|Shader compilation failed" walk.log; then
          echo "::error::shader compilation failed during the walk capture — the frames show a fallback material"
          grep -nE "SHADER ERROR|Shader compilation failed" walk.log | head -20
          exit 1
        fi
      shell: bash
    - if: inputs.group == 'activity'
      name: Capture the opt-in grounded run
      run: |
        set -o pipefail
        mkdir -p "${RUNNER_TEMP}/shots/run"
        if ! cp client/recipes/wanderer.json "${RUNNER_TEMP}/run_save.json"; then
          echo "::error::could not seed the run-capture save from client/recipes/wanderer.json"
          exit 1
        fi
        WAR_SCENARIO=run \
        WAR_RUN_CYCLE=1 \
        WAR_SHOT_DIR="${RUNNER_TEMP}/shots/run" \
        WAR_SAVE_PATH="${RUNNER_TEMP}/run_save.json" \
        WAR_VAULT_PATH="${RUNNER_TEMP}/run_save_vault.json" \
        WAR_BOOT_RECOVERY_PATH="${RUNNER_TEMP}/run_save_recovery.json" \
          godot --path client res://tools/frame_capture.tscn 2>&1 | tee run.log
        if ! grep -qE "[0-9]+ run phases written" run.log; then
          echo "::error::run capture did not report a phase sequence — see log"; tail -40 run.log; exit 1
        fi
        if grep -qE "SHADER ERROR|Shader compilation failed" run.log; then
          echo "::error::shader compilation failed during the run capture — the frames show a fallback material"
          grep -nE "SHADER ERROR|Shader compilation failed" run.log | head -20
          exit 1
        fi
        # The phase marker says the tool finished; it does not say the game
        # was healthy while it shot. A capture that half-booted, or that hit
        # a script error after the world built, still writes renderable
        # frames — and publishing those as movement evidence is worse than
        # publishing none. Same two checks the world capture makes, including
        # its Metal `timeout waiting for fence` exemption (a virtualised
        # adapter retry that recovers, not a render fault) and its
        # filter-to-a-FILE form, which avoids the pipefail/SIGPIPE hazard
        # where `grep -v … | grep -q …` can read as "no errors found".
        if ! grep -q "BOOT_OK" run.log; then
          echo "::error::run capture never reached BOOT_OK — frames depict a partially booted game"
          tail -40 run.log; exit 1
        fi
        grep -vE "timeout waiting for fence|drivers/metal/rendering_device_driver_metal" \
          run.log > run.filtered.log || true
        if grep -qE "SCRIPT ERROR|^ERROR" run.filtered.log; then
          echo "::error::errors during the run capture — the frames may not depict a healthy game"
          grep -nE "SCRIPT ERROR|^ERROR" run.filtered.log | head -20
          exit 1
        fi
      shell: bash
    - if: inputs.group == 'activity'
      name: Capture the walk-to-run transition
      run: |
        set -o pipefail
        mkdir -p "${RUNNER_TEMP}/shots/gait-transition"
        if ! cp client/recipes/wanderer.json "${RUNNER_TEMP}/gait_transition_save.json"; then
          echo "::error::could not seed the gait-transition save from client/recipes/wanderer.json"
          exit 1
        fi
        WAR_SCENARIO=gait_transition \
        WAR_WALK_CYCLE=1 \
        WAR_RUN_CYCLE=1 \
        WAR_SHOT_DIR="${RUNNER_TEMP}/shots/gait-transition" \
        WAR_SAVE_PATH="${RUNNER_TEMP}/gait_transition_save.json" \
        WAR_VAULT_PATH="${RUNNER_TEMP}/gait_transition_vault.json" \
        WAR_BOOT_RECOVERY_PATH="${RUNNER_TEMP}/gait_transition_recovery.json" \
          godot --path client res://tools/frame_capture.tscn 2>&1 | tee gait-transition.log
        if ! grep -qE "[0-9]+ gait transition frames written" gait-transition.log; then
          echo "::error::gait-transition capture did not report a complete sequence — see log"
          tail -40 gait-transition.log
          exit 1
        fi
        if ! grep -q "BOOT_OK" gait-transition.log; then
          echo "::error::gait-transition capture never reached BOOT_OK — frames depict a partially booted game"
          tail -40 gait-transition.log
          exit 1
        fi
        grep -vE "timeout waiting for fence|drivers/metal/rendering_device_driver_metal" \
          gait-transition.log > gait-transition.filtered.log || true
        if grep -qE "SCRIPT ERROR|^ERROR" gait-transition.filtered.log; then
          echo "::error::errors during the gait-transition capture — the sequence may not depict a healthy game"
          grep -nE "SCRIPT ERROR|^ERROR" gait-transition.filtered.log | head -20
          exit 1
        fi
        if grep -qE "SHADER ERROR|Shader compilation failed" gait-transition.log; then
          echo "::error::shader compilation failed during the gait-transition capture — the frames show a fallback material"
          grep -nE "SHADER ERROR|Shader compilation failed" gait-transition.log | head -20
          exit 1
        fi
      shell: bash
    - if: inputs.group == 'activity'
      name: Capture the controller-driven gait
      run: |
        set -o pipefail
        mkdir -p "${RUNNER_TEMP}/shots/gait-drive"
        if ! cp client/recipes/wanderer.json "${RUNNER_TEMP}/gait_drive_save.json"; then
          echo "::error::could not seed the gait-drive save from client/recipes/wanderer.json"
          exit 1
        fi
        WAR_SCENARIO=gait_drive \
        WAR_WALK_CYCLE=1 \
        WAR_RUN_CYCLE=1 \
        WAR_SHOT_DIR="${RUNNER_TEMP}/shots/gait-drive" \
        WAR_SAVE_PATH="${RUNNER_TEMP}/gait_drive_save.json" \
        WAR_VAULT_PATH="${RUNNER_TEMP}/gait_drive_vault.json" \
        WAR_BOOT_RECOVERY_PATH="${RUNNER_TEMP}/gait_drive_recovery.json" \
          godot --path client res://tools/frame_capture.tscn 2>&1 | tee gait-drive.log
        if ! grep -qE "[0-9]+ gait drive frames written" gait-drive.log; then
          echo "::error::gait-drive capture did not report a complete drive — see log"
          tail -40 gait-drive.log
          exit 1
        fi
        if ! grep -q "BOOT_OK" gait-drive.log; then
          echo "::error::gait-drive capture never reached BOOT_OK — frames depict a partially booted game"
          tail -40 gait-drive.log
          exit 1
        fi
        grep -vE "timeout waiting for fence|drivers/metal/rendering_device_driver_metal" \
          gait-drive.log > gait-drive.filtered.log || true
        if grep -qE "SCRIPT ERROR|^ERROR" gait-drive.filtered.log; then
          echo "::error::errors during the gait-drive capture — the drive may not depict a healthy game"
          grep -nE "SCRIPT ERROR|^ERROR" gait-drive.filtered.log | head -20
          exit 1
        fi
        if grep -qE "SHADER ERROR|Shader compilation failed" gait-drive.log; then
          echo "::error::shader compilation failed during the gait-drive capture — the frames show a fallback material"
          grep -nE "SHADER ERROR|Shader compilation failed" gait-drive.log | head -20
          exit 1
        fi
        # The measured gait, above the fold: a reviewer should not need to
        # open the artifact to learn the cadence or that the feet slide.
        {
          echo "### Controller-driven gait (#516)"
          echo
          grep -E "^GAIT DRIVE" gait-drive.log | sed 's/^GAIT DRIVE /- /'
        } >> "$GITHUB_STEP_SUMMARY"
      shell: bash
    - name: Frames actually exist
      run: |
        count=$(find "${RUNNER_TEMP}/shots" -name '*.png' -size +10k | wc -l | tr -d ' ')
        if [ "$count" -lt 1 ]; then
          echo "::error::no non-trivial PNGs produced"; ls -la "${RUNNER_TEMP}/shots" || true; exit 1
        fi
        echo "captured $count frame(s)"
      shell: bash
    - name: Seal the complete native capture
      env:
        CAPTURE_GROUP: ${{ inputs.group }}
      run: bash tools/source-evidence-package.sh head
      shell: bash
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: source-head-${{ github.sha }}-${{ github.run_attempt }}-${{ inputs.group }}
        path: |
          ${{ runner.temp }}/shots/*.png
          ${{ runner.temp }}/shots/*.txt
          ${{ runner.temp }}/shots/light-response/*.png
          ${{ runner.temp }}/shots/light-response/*.txt
          ${{ runner.temp }}/shots/opt-in-previews/*.png
          ${{ runner.temp }}/shots/opt-in-previews/*.txt
          ${{ runner.temp }}/shots/walk/*.png
          ${{ runner.temp }}/shots/walk/*.txt
          ${{ runner.temp }}/shots/breath/*.png
          ${{ runner.temp }}/shots/breath/*.txt
          ${{ runner.temp }}/shots/run/*.png
          ${{ runner.temp }}/shots/run/*.txt
          ${{ runner.temp }}/shots/gait-transition/*.png
          ${{ runner.temp }}/shots/gait-transition/*.txt
          ${{ runner.temp }}/shots/gait-drive/*.png
          ${{ runner.temp }}/shots/gait-drive/*.txt
          ${{ runner.temp }}/shots/replication/*.png
          ${{ runner.temp }}/shots/replication/*.txt
          ${{ runner.temp }}/shots/mob-chase/*.png
          ${{ runner.temp }}/shots/mob-chase/*.txt
          ${{ runner.temp }}/shots/evidence.json
          ${{ runner.temp }}/shots/logs/*.log
        if-no-files-found: error
