# Create once in the tenant's own vault path; reconciliation never rotates it.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: world-at-ruin-zone-admission
spec:
  updatePolicy: IfNotExists
  deletionPolicy: None
  refreshInterval: 1h
  secretStoreRefs:
    - name: world-at-ruin
      kind: SecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: world-at-ruin-zone-admission
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: apps/world-at-ruin/admission
          property: secret
