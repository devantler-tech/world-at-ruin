# Only the authenticated operator tunnel reaches this integration trial.
# There is no public route and no need for outbound traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: world-at-ruin-zone
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: world-at-ruin-zone
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
